document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.id === 'clave') { ev.preventDefault(); entrar(); }
});

window.addEventListener('hashchange', leerRuta);

// ───────────────────────────────────────────────────────────────────────
// Latido: consultar el estado sin bloquear la pantalla
//
// Las etapas largas no se esperan. Se lanza el trabajo y se pregunta cada
// pocos segundos por su estado. Nada de SSE: en Vercel no funciona, y además
// la consulta es lo que hace avanzar el trabajo en un entorno sin servidor.
// ───────────────────────────────────────────────────────────────────────

// ───────────────────────────────────────────────────────────────────────
// LA COLA: generar una etapa entera sin ir dando a un botón por elemento
//
// Aprobar uno por uno es la regla del producto y no se toca. Lanzar uno por
// uno no es una regla, es trabajo tonto: diecisiete imágenes son diecisiete
// idas y venidas a la ficha de cada activo. La cola separa las dos cosas —
// GENERAR se automatiza, APROBAR sigue siendo tuyo, elemento por elemento.
//
// Va en el navegador a propósito. En Vercel no hay proceso que sobreviva a la
// petición: no existe un sitio donde vivir un trabajador de fondo. El latido
// ya vuelve cada pocos segundos, así que la cola se cuelga de él.
//
// Corre EN SERIE, nunca en paralelo. Dos motivos: el límite de peticiones por
// minuto de Vertex, y que lanzar diecisiete a la vez desde un móvil es más
// lento que lanzarlas seguidas.
//
// Y respeta las dependencias sin saber nada de ellas: sólo lanza lo que el
// servidor dice que se puede lanzar. Cuando ya no queda nada porque falta que
// apruebes algo, la cola NO se muere: se queda esperando, y en cuanto apruebas
// sigue sola. Eso es lo que hace que «generar todas las imágenes» funcione
// aunque el escenario dependa del personaje.
// ───────────────────────────────────────────────────────────────────────

// Descanso entre lanzamientos, por tipo de medio. No es el límite real —ese
// depende de la cuota de cada cuenta— sino un ritmo prudente de salida. Si
// Google contesta que no, el freno de abajo lo estira solo.
var RITMO_MS = { image: 8000, video: 12000, audio: 8000 };

// El freno cuando salta la cuota. Empieza en medio minuto y se dobla hasta
// tres, que es más que de sobra para cualquier límite por minuto.
// Lo que se espera tras un fallo que NO es de cuota. Generoso a propósito:
// un fallo repetido casi siempre es de configuración, y machacar la API no
// lo arregla — sólo consume cuota y reinicia el contador del límite.
var FALLO_ESPERA_MS = 15000;

var FRENO_MIN_MS = 30000;
var FRENO_MAX_MS = 180000;

/**
 * Deja un error en algo que se pueda leer en un móvil.
 *
 * Cuando la URL de Vertex sale mal, Google no contesta un JSON: contesta su
 * página 404 en HTML entera. El usuario veía media pantalla de `<!DOCTYPE html>
 * <meta charset=utf-8>…` sin ninguna pista de qué había pasado.
 */
function recorte(texto, max){
  var t = String(texto || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  return t.length > max ? t.slice(0, max) + '…' : t;
}

/** ¿Este error es «Google me está frenando» y no «esto está roto»? */
function esLimiteDeCuota(e){
  var m = String((e && e.message) || '');
  return /429|cuota|quota|limitando|RESOURCE_EXHAUSTED|rate limit|too many/i.test(m);
}

function colaVacia(etapa){
  // `rotos` es la lista de los que ya fallaron en ESTA cola. Sin ella, la cola
  // volvía a elegir el mismo una y otra vez: un activo que falla no queda «en
  // revisión», vuelve a pendiente, así que seguía siendo el primero de la lista
  // y la cola se comía ocho intentos seguidos contra el mismo clip roto.
  return { proyectoId: estado.proyectoId, etapa: etapa, activa: true, actual: null, hechos: 0,
           fallos: [], rotos: {}, esperaHasta: 0, freno: 0, aviso: '' };
}

/** Los activos de la cola: los de la etapa, o todos si la etapa es 'todo'. */
function colaActivos(p){
  var c = estado.cola;
  if (!c) return [];
  return activos(p).filter(function(a){ return c.etapa === 'todo' || a.stage === c.etapa; });
}

/** Lo que le queda por hacer a la cola: ni aprobado, ni ya en revisión. */
function colaPendientes(p){
  return colaActivos(p).filter(function(a){
    // En revisión NO es pendiente: ya está generado y lo que falta es tu
    // decisión, que es justo lo que la cola no hace por ti.
    return a.status !== 'approved' && a.status !== 'review' && !a.locked;
  });
}

/** El siguiente que se puede lanzar AHORA, respetando dependencias. */
function colaSiguiente(p){
  var rotos = (estado.cola && estado.cola.rotos) || {};
  var libres = colaPendientes(p).filter(function(a){
    // Lo que ya falló en esta cola no se vuelve a intentar solo. Se regenera a
    // mano, que es cuando alguien ha mirado el error y sabe si tiene arreglo.
    return !rotos[a.id] && a.status !== 'generating' && puedeGenerar(p, a).ok;
  });
  return libres.length ? libres[0] : null;
}

function arrancarCola(etapa){
  estado.cola = colaVacia(etapa);
  pintar();
  colaTic();
}

function pararCola(motivo){
  if (!estado.cola) return;
  estado.cola = null;
  if (motivo) avisar(motivo);
  pintar();
}

/**
 * Un paso de la cola. Lo llama el latido, y también cada aprobación: así,
 * en cuanto apruebas el personaje, el escenario sale sin que toques nada.
 */
async function colaTic(){
  var c = estado.cola, p = estado.proyecto;
  if (!c || !c.activa || !p) return;
  // Cambiar de corto cancela la cola: es de ese proyecto, no del estudio.
  if (c.proyectoId !== p.id) { estado.cola = null; return; }
  if (c.actual) return;                       // hay una en marcha: esperar
  if (Date.now() < c.esperaHasta) return;     // descanso o freno

  // Si algo está generándose (lo lanzó la cola antes de recargar, o lo lanzaste
  // tú a mano), no se lanza nada encima.
  if (colaActivos(p).some(function(a){ return a.status === 'generating'; })) return;

  var siguiente = colaSiguiente(p);
  if (!siguiente) {
    var quedan = colaPendientes(p);
    if (!quedan.length) {
      var etiqueta = c.etapa === 'todo' ? 'el corto' : ETIQ_ETAPA[c.etapa];
      pararCola('Cola terminada: ya no queda nada por generar en ' + etiqueta + '.');
      return;
    }
    // Queda material, pero está esperando a que apruebes algo. La cola se
    // queda armada: no se pierde el trabajo de haberla puesto en marcha.
    c.aviso = 'En espera: ' + quedan.length + (quedan.length === 1 ? ' elemento necesita' : ' elementos necesitan') +
      ' que apruebes algo antes de poder generarse.';
    pintar();
    return;
  }

  c.actual = siguiente.id;
  c.aviso = '';
  pintar();
  try {
    await api.generar(p.id, siguiente.id);
    c.hechos += 1;
    // Ha ido bien: se afloja el freno poco a poco por si la cuota se abrió.
    if (c.freno) c.freno = Math.max(0, Math.round(c.freno * 0.6));
    c.esperaHasta = Date.now() + (c.freno || RITMO_MS[MEDIO_DE_TIPO[siguiente.kind]] || 8000);
  } catch (e) {
    if (esLimiteDeCuota(e)) {
      // No es un fallo del activo: es la cuota. Se espera y se vuelve a
      // intentar EL MISMO, sin contarlo como error ni saltárselo.
      c.freno = Math.min(FRENO_MAX_MS, Math.max(FRENO_MIN_MS, c.freno * 2));
      c.esperaHasta = Date.now() + c.freno;
      c.aviso = 'Google está limitando las peticiones. Reintento en ' + Math.round(c.freno / 1000) + ' s.';
    } else {
      // Un fallo de verdad: se anota, se marca para no repetirlo, y la cola
      // sigue con los demás. Pararla entera por un activo roto obligaría a
      // relanzar los dieciséis que quedaban.
      c.rotos[siguiente.id] = true;
      c.fallos.push({ id: siguiente.id, label: siguiente.label, error: String(e && e.message || e) });

      // Y se espera de verdad antes del siguiente. Encadenar fallos a dos
      // segundos era lo peor de los dos mundos: si el error venía de la cuenta
      // —una región mal puesta, un permiso que falta— la cola quemaba los
      // diecisiete en medio minuto; y si venía de un límite por minuto mal
      // identificado, cada reintento reiniciaba la cuenta del límite.
      c.esperaHasta = Date.now() + FALLO_ESPERA_MS;

      // Tres fallos seguidos no son tres activos con mala suerte: es que algo
      // está mal en la configuración y los catorce restantes van a fallar
      // igual. Se para y se le enseña el error al usuario.
      if (c.fallos.length >= 3 && c.hechos === 0) {
        c.activa = false;
        c.aviso = 'Cola detenida: han fallado ' + c.fallos.length + ' seguidos sin que ninguno saliera bien. ' +
          'Eso no es mala suerte, es que algo está mal configurado. Mira el error en el primero que falló.';
        pintar();
        return;
      }
    }
  } finally {
    c.actual = null;
  }

  try { await cargarProyecto(p.id, true); } catch (e) { /* el latido reintenta */ }
  pintar();
  latir(true);
}

/** La barra de la cola, arriba del todo mientras está en marcha. */
function htmlCola(p){
  var c = estado.cola;
  if (!c) return '';
  var pendientes = colaPendientes(p).length;
  var enRevision = colaActivos(p).filter(function(a){ return a.status === 'review'; }).length;
  var espera = Math.max(0, Math.ceil((c.esperaHasta - Date.now()) / 1000));
  var etiqueta = c.etapa === 'todo' ? 'todo el corto' : ETIQ_ETAPA[c.etapa];

  var linea = c.actual
    ? 'Generando: ' + esc((colaActivos(p).find(function(a){ return a.id === c.actual; }) || {}).label || c.actual)
    : (espera ? 'Siguiente en ' + espera + ' s' : (c.aviso ? '' : 'Buscando qué generar…'));

  return '<div class="tarjeta" style="border-color:var(--acento)">' +
    '<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px">' +
      '<div style="min-width:0"><p class="sube">Cola · ' + esc(etiqueta) + '</p>' +
        '<h3 style="margin:0">' + c.hechos + ' generadas · ' + pendientes + ' por generar</h3></div>' +
      '<button class="btn fantasma pequeno" data-accion="cola-parar">Parar</button>' +
    '</div>' +
    (linea ? '<p class="tenue mini">' + linea + '</p>' : '') +
    (c.aviso ? '<div class="nota aviso" style="margin-top:8px">' + esc(c.aviso) + '</div>' : '') +
    (enRevision ? '<div class="nota" style="margin-top:8px"><b>' + enRevision +
      (enRevision === 1 ? ' generación espera' : ' generaciones esperan') +
      ' tu decisión.</b> Puedes ir aprobando mientras la cola sigue trabajando.</div>' : '') +
    (c.fallos.length ? '<div class="nota mala" style="margin-top:8px"><b>' + c.fallos.length +
      (c.fallos.length === 1 ? ' ha fallado' : ' han fallado') + ':</b> ' +
      esc(c.fallos.slice(-3).map(function(f){ return f.label; }).join(', ')) +
      '.<br><span class="mini">' + esc(recorte(c.fallos[c.fallos.length - 1].error, 180)) + '</span>' +
      '<br>La cola no los reintenta sola: míralos y regenéralos a mano.</div>' : '') +
  '</div>';
}

var latidoTimer = null;
var latidoOcupado = false;

function latir(inmediato){
  if (latidoTimer) clearTimeout(latidoTimer);
  latidoTimer = setTimeout(tic, inmediato ? 800 : 5000);
}

async function tic(){
  latidoTimer = null;
  if (latidoOcupado) { latir(); return; }

  var p = estado.proyecto;
  if (!p || estado.clave === '') { latir(); return; }

  var generando = activos(p).filter(function(a){ return a.status === 'generating'; });
  var montando = p.finalCut && p.finalCut.status === 'building';
  // La cola tiene que moverse aunque no haya nada en marcha: es justo cuando
  // está descansando entre lanzamientos o esperando a que apruebes algo.
  if (estado.cola) { try { await colaTic(); } catch (e) { console.warn('[ams] cola', e && e.message); } }
  if (!generando.length && !montando) {
    // Con la cola viva se repinta igual: la cuenta atrás del descanso tiene
    // que verse correr, o parece que se ha quedado colgada.
    if (estado.cola) pintar(true);
    latir();
    return;
  }

  latidoOcupado = true;
  try {
    // Sólo unas pocas por vuelta: veinte consultas simultáneas desde un móvil
    // son más lentas que cuatro seguidas, y agotan el límite del proveedor.
    for (var i = 0; i < Math.min(generando.length, 4); i++) {
      var a = generando[i];
      var gen = (a.generations || []).filter(function(g){ return g.status === 'generating'; }).pop();
      if (!gen) continue;
      try { await api.estadoGeneracion(p.id, a.id, gen.id); }
      catch (e) {
        // Un fallo al consultar no debe romper el bucle: el proyecto que se
        // recarga a continuación es la fuente de verdad.
        console.warn('[ams] consulta de generación', a.id, e && e.message);
      }
    }

    if (montando) {
      try { await api.estadoMontaje(p.id, estado.montajeJob); }
      catch (e) { console.warn('[ams] consulta de montaje', e && e.message); }
    }

    await cargarProyecto(p.id, true);
    // Se compara contra lo que hay PINTADO, no contra lo que había cargado: si
    // el repintado se saltó (porque estabas escribiendo o mirando un clip), la
    // diferencia sigue ahí y el siguiente latido lo reintenta.
    if (estado.proyecto && huella(estado.proyecto) !== huellaPintada) pintar(true);
  } finally {
    latidoOcupado = false;
    latir();
  }
}

/** Resumen del proyecto que cambia sólo cuando cambia algo visible. */
function huella(p){
  return String(p.updatedAt || '') + '|' +
    activos(p).map(function(a){
      return a.id + ':' + a.status + ':' + (a.approvedGenerationId || '') + ':' + (a.generations || []).length + ':' + (a.stale ? 1 : 0);
    }).join(',') + '|' + ((p.finalCut && p.finalCut.status) || '');
}

// ───────────────────────────────────────────────────────────────────────
// Arranque
// ───────────────────────────────────────────────────────────────────────

(function inicio(){
  var guardada = '';
  try { guardada = localStorage.getItem(CLAVE_ALMACEN) || ''; } catch (e) {}
  latir();

  if (!guardada) { $('acceso').classList.remove('oculto'); return; }

  estado.clave = guardada;
  $('app').classList.remove('oculto');
  arrancar().catch(function(e){
    // Si la clave guardada ya no vale, pedir() habrá abierto el acceso; si el
    // fallo es otro, se enseña tal cual en vez de dejar la pantalla vacía.
    avisarError(e);
  });
})();
</script>
