/** El formato elegido, para poder enseñar su descripción bajo las fichas. */
/** El nombre legible de un formato, para la ficha del proyecto. */
function nombreFormato(id){
  var lista = (estado.catalogo && estado.catalogo.formatos) || [];
  var hallado = lista.find(function(x){ return x.id === id; });
  if (hallado) return hallado.etiqueta + ' · ' + hallado.proporcion;
  return id || 'vertical';
}

function formatoElegido(f, formatos){
  var hallado = formatos.find(function(x){ return x.id === f.formato; });
  return hallado || formatos[0] || { para: '' };
}

/**
 * La cabecera de una pantalla, con su botón de volver.
 *
 * Antes cada pantalla se armaba la suya a mano y tres se quedaron sin salida:
 * se entraba en Biblioteca, en Perfil o en Nuevo corto y no había forma de
 * regresar salvo tocar otra pestaña, que no es lo mismo — se pierde dónde
 * estabas. Con esto, todas la tienen.
 *
 * `volverA` es la ruta del botón; si no se pasa, no hay botón (el panel es la
 * pantalla raíz y no tiene a dónde volver).
 */
function htmlCab(titulo, subtitulo, volverA, extra){
  return '<div class="cab">' +
    (volverA
      ? '<button class="btn fantasma pequeno" data-accion="ir" data-ruta="' + esc(volverA) + '" aria-label="Volver">‹</button>'
      : '') +
    '<div class="cab-tit"><h1>' + esc(titulo) + '</h1>' +
      (subtitulo ? '<p>' + esc(subtitulo) + '</p>' : '') +
    '</div>' +
    (extra || '') +
  '</div>';
}

function prepararFormulario(){
  var c = estado.catalogo || {};
  var primera = function(lista, id){
    if (!Array.isArray(lista) || !lista.length) return '';
    var hallado = lista.find(function(x){ return x.id === id; });
    return (hallado || lista[0]).id;
  };
  estado.form = {
    busqueda: '',
    categoria: '',
    instrumentos: [],
    formacion: primera(c.formations, 'solo'),
    genero: primera(c.performerGenders, 'female'),
    tipo: '',
    escenario: primera(c.scenarios, 'forest'),
    escenarioTexto: '',
    estilo: primera(c.visualStyles, 'anime_cinematic'),
    estiloTexto: '',
    // 'auto' = que lo decida el Director a partir del instrumento. Es el de
    // siempre: quien no quiera pensar en géneros no tiene que tocar nada.
    generoMusical: 'auto',
    generoMusicalTexto: '',
    duracion: 120,
    formato: primera(c.formatos, 'vertical'),
    modeloImagen: modeloPorDefecto(c.modelosImagen),
    modeloVideo: modeloPorDefecto(c.modelosVideo),
    direccion: '',
    // Una ficha por intérprete principal. Empieza vacía: vacío = decide el
    // Director. `fichaAbierta` es sólo pantalla, no viaja al servidor.
    fichas: [],
    fichaAbierta: 1
  };
  ajustarTipos();
}

/**
 * ¿Este modelo viene impuesto por el entorno del servidor?
 *
 * Cuando IMAGE_MODEL o VEO_MODEL están puestos, el servidor añade ese modelo
 * al catálogo marcado, y ese es el que manda: es la vía de escape de un
 * proyecto que no tiene acceso al resto. Lo único que el contrato promete es
 * que la marca existe, no cómo se llama, así que se aceptan varios nombres en
 * vez de romperse por una letra.
 */
function modeloDelEntorno(m){
  return !!(m && (m.deEntorno || m.desdeEntorno || m.delEntorno || m.entorno || m.porDefecto));
}

/** El modelo que sale elegido de entrada: el impuesto, o el primero de la
 *  lista — que el catálogo llega del más barato al más caro. */
function modeloPorDefecto(lista){
  if (!Array.isArray(lista) || !lista.length) return '';
  var forzado = lista.find(modeloDelEntorno);
  return (forzado || lista[0]).id;
}

/** Lista de modelos como fichas de elección, en el orden en que vienen. */
function htmlModelos(lista, elegido, accion){
  if (!Array.isArray(lista) || !lista.length) {
    return '<p class="tenue mini">El servidor no ofreció ningún modelo para elegir; el corto usará el que tenga configurado.</p>';
  }
  return '<div class="opciones corta">' + lista.map(function(m){
    var puesto = (m.id === elegido);
    var nivel = String(m.nivel || '');
    var pie = [m.id, m.region, modeloDelEntorno(m) ? 'fijado por el servidor' : ''].filter(Boolean).join(' · ');
    return '<button class="opcion modelo' + (puesto ? ' on' : '') + '" data-accion="' + accion + '" data-id="' + esc(m.id) + '">' +
      '<span class="modelo-txt">' +
        '<b>' + esc(m.etiqueta || m.id) + '</b>' +
        (m.para ? '<small>' + esc(m.para) + '</small>' : '') +
        '<small class="modelo-id">' + esc(pie) + '</small>' +
      '</span>' +
      '<span class="nivel n-' + esc(nivel) + '">' + esc(ETIQ_NIVEL[nivel] || nivel || 'sin nivel') + '</span>' +
    '</button>';
  }).join('') + '</div>';
}

function htmlModelosImagen(){
  var c = estado.catalogo || {};
  return htmlModelos(c.modelosImagen, estado.form.modeloImagen, 'modelo-imagen');
}

function htmlModelosVideo(){
  var c = estado.catalogo || {};
  return htmlModelos(c.modelosVideo, estado.form.modeloVideo, 'modelo-video');
}

/**
 * Cómo se nombra un modelo ya guardado en un proyecto.
 *
 * Un proyecto viejo no guardó ninguno, y uno guardado puede haber
 * desaparecido del catálogo: en los dos casos se enseña lo que haya en vez de
 * dejar la ficha con un hueco que parece un fallo.
 */
function nombreModelo(clave, id){
  if (!id) return 'el que tenga configurado el servidor';
  var lista = (estado.catalogo && estado.catalogo[clave]) || [];
  var m = lista.find(function(x){ return x.id === id; });
  if (!m) return id;
  var nivel = ETIQ_NIVEL[m.nivel] || m.nivel || '';
  return (m.etiqueta || m.id) + (nivel ? ' · ' + nivel : '') + ' (' + m.id + ')';
}

/** Los tipos de intérprete dependen del género elegido: se recalculan siempre. */
function tiposDisponibles(){
  var c = estado.catalogo || {};
  var f = estado.form;
  return (c.performerTypes || []).filter(function(t){
    return !t.genderIds || t.genderIds.indexOf(f.genero) !== -1;
  });
}

function ajustarTipos(){
  var lista = tiposDisponibles();
  if (!lista.length) { estado.form.tipo = ''; return; }
  if (!lista.some(function(t){ return t.id === estado.form.tipo; })) estado.form.tipo = lista[0].id;
}

function instrumentosFiltrados(){
  var c = estado.catalogo || {};
  var f = estado.form;
  var lista = c.instruments || [];
  if (f.categoria) lista = lista.filter(function(i){ return i.categoryId === f.categoria; });
  var q = normalizar(f.busqueda);
  if (q) {
    lista = lista.filter(function(i){
      var campos = [i.name, i.id].concat(i.aliases || []).concat([i.origin || '']);
      return campos.some(function(v){ return normalizar(v).indexOf(q) !== -1; });
    });
  }
  return lista.slice(0, 40);
}

function htmlInstrumentos(){
  var c = estado.catalogo || {};
  var f = estado.form;
  var cats = {};
  (c.instrumentCategories || []).forEach(function(x){ cats[x.id] = x.label; });
  var lista = instrumentosFiltrados();
  if (!lista.length) {
    return '<p class="tenue mini" style="margin-top:12px">Ningún instrumento coincide con «' + esc(f.busqueda) + '».</p>';
  }
  return '<div class="opciones">' + lista.map(function(i){
    var puesto = f.instrumentos.indexOf(i.id) !== -1;
    return '<button class="opcion' + (puesto ? ' on' : '') + '" data-accion="instr" data-id="' + esc(i.id) + '">' +
      '<span><b>' + esc(i.name) + '</b><br><small>' + esc(cats[i.categoryId] || '') +
      (i.origin ? ' · ' + esc(i.origin) : '') + '</small></span>' +
      '<span class="etiq' + (puesto ? ' approved' : '') + '">' + (puesto ? 'elegido' : 'añadir') + '</span>' +
    '</button>';
  }).join('') + '</div>';
}

function htmlChipsElegidos(){
  var c = estado.catalogo || {};
  var f = estado.form;
  if (!f.instrumentos.length) {
    return '<p class="tenue mini" style="margin-top:10px">Elige al menos un instrumento.</p>';
  }
  var porId = {};
  (c.instruments || []).forEach(function(i){ porId[i.id] = i; });
  return '<div class="chips" style="margin-top:10px">' + f.instrumentos.map(function(id){
    return '<button class="chip on quitar" data-accion="instr" data-id="' + esc(id) + '">' +
      esc(porId[id] ? porId[id].name : id) + '</button>';
  }).join('') + '</div>';
}

function htmlTipos(){
  var lista = tiposDisponibles();
  if (!lista.length) return '<p class="tenue mini">No hay tipos para este intérprete.</p>';
  return '<div class="chips">' + lista.map(function(t){
    return '<button class="chip' + (estado.form.tipo === t.id ? ' on' : '') + '" data-accion="tipo" data-id="' + esc(t.id) + '">' +
      esc(t.label) + '</button>';
  }).join('') + '</div>';
}

function vistaCrear(){
  var cab = htmlCab('Nuevo corto', 'La IA propone; tú apruebas cada pieza.', '#/proyectos');

  if (!estado.catalogo) return cab + htmlCargando('Cargando los catálogos…');
  if (!estado.form) prepararFormulario();

  var c = estado.catalogo, f = estado.form;
  var duraciones = c.durations && c.durations.length ? c.durations
    : [{ seconds:60, label:'1 min' }, { seconds:120, label:'2 min' }, { seconds:180, label:'3 min' }];
  // Si el servidor es más viejo que la interfaz y no manda formatos, se usan
  // los dos de siempre en vez de dejar el bloque en blanco.
  var formatos = c.formatos && c.formatos.length ? c.formatos
    : [{ id:'vertical', etiqueta:'Vertical', proporcion:'9:16', para:'Para Reels, TikTok y Shorts.' },
       { id:'horizontal', etiqueta:'Apaisado', proporcion:'16:9', para:'Para YouTube y pantalla grande.' }];

  var html = cab;

  html += '<div class="tarjeta">' +
    '<h3><span class="paso">1</span>Instrumentos</h3>' +
    '<input type="search" id="f-busqueda" placeholder="Buscar: erhu, guzheng, violonchelo, taiko…" value="' + esc(f.busqueda) + '" data-campo="busqueda">' +
    '<div class="chips" style="margin-top:10px">' +
      '<button class="chip' + (f.categoria === '' ? ' on' : '') + '" data-accion="categoria" data-id="">Todas</button>' +
      (c.instrumentCategories || []).map(function(k){
        return '<button class="chip' + (f.categoria === k.id ? ' on' : '') + '" data-accion="categoria" data-id="' + esc(k.id) + '">' + esc(k.label) + '</button>';
      }).join('') +
    '</div>' +
    '<div id="chips-elegidos">' + htmlChipsElegidos() + '</div>' +
    '<div id="lista-instr">' + htmlInstrumentos() + '</div>' +
  '</div>';

  html += '<div class="tarjeta">' +
    '<h3><span class="paso">2</span>Formación e intérprete</h3>' +
    '<label class="campo"><span>Formación musical</span>' +
      '<select data-campo="formacion">' + (c.formations || []).map(function(x){
        return '<option value="' + esc(x.id) + '"' + (f.formacion === x.id ? ' selected' : '') + '>' + esc(x.label) +
          (x.performerCount ? ' (' + x.performerCount + ')' : '') + '</option>';
      }).join('') + '</select></label>' +
    '<label class="campo"><span>Intérprete</span>' +
      '<select data-campo="genero">' + (c.performerGenders || []).map(function(x){
        return '<option value="' + esc(x.id) + '"' + (f.genero === x.id ? ' selected' : '') + '>' + esc(x.label) + '</option>';
      }).join('') + '</select></label>' +
    '<span style="display:block;font-size:12.5px;font-weight:700;color:var(--tenue);margin-bottom:6px">Tipo visual</span>' +
    '<div id="tipos-interprete">' + htmlTipos() + '</div>' +
  '</div>';

  var escOtro = (f.escenario === 'other');
  html += '<div class="tarjeta">' +
    '<h3><span class="paso">3</span>Escenario</h3>' +
    '<label class="campo"><select data-campo="escenario">' + (c.scenarios || []).map(function(x){
      return '<option value="' + esc(x.id) + '"' + (f.escenario === x.id ? ' selected' : '') + '>' + esc(x.label) + '</option>';
    }).join('') + '</select></label>' +
    '<textarea data-campo="escenarioTexto" rows="2" placeholder="' +
      (escOtro ? 'Describe el escenario personalizado (obligatorio)' : 'Opcional: matiza el escenario («bosque de bambú con niebla baja»)') +
      '">' + esc(f.escenarioTexto) + '</textarea>' +
  '</div>';

  var estOtro = (f.estilo === 'other');
  html += '<div class="tarjeta">' +
    '<h3><span class="paso">4</span>Estilo visual</h3>' +
    '<label class="campo"><select data-campo="estilo">' + (c.visualStyles || []).map(function(x){
      return '<option value="' + esc(x.id) + '"' + (f.estilo === x.id ? ' selected' : '') + '>' + esc(x.label) + '</option>';
    }).join('') + '</select></label>' +
    '<textarea data-campo="estiloTexto" rows="2" placeholder="' +
      (estOtro ? 'Describe el estilo personalizado (obligatorio)' : 'Opcional: instrucciones de estilo adicionales') +
      '">' + esc(f.estiloTexto) + '</textarea>' +
  '</div>';

  // EL GÉNERO DE LA MÚSICA. Va justo después del estilo visual porque es la
  // misma decisión por el otro lado: uno dice cómo se ve el corto y el otro
  // cómo suena. Y va aquí, y no escondido en la dirección creativa, porque de
  // él sale también con cuánta fuerza toca el personaje en el vídeo.
  var genOtro = (f.generoMusical === 'other');
  var generos = c.musicGenres || [];
  var generoElegido = generos.find(function(x){ return x.id === f.generoMusical; });
  html += '<div class="tarjeta">' +
    '<h3><span class="paso">5</span>Género musical</h3>' +
    '<p class="tenue mini" style="margin-bottom:10px">Manda sobre la música <b>y sobre el vídeo</b>: un joropo se rasguea fuerte y un bolero se toca despacio, ' +
      'y el personaje tiene que tocar como suena. Si lo dejas en automático, lo decide el instrumento.</p>' +
    '<label class="campo"><select data-campo="generoMusical">' + generos.map(function(x){
      return '<option value="' + esc(x.id) + '"' + (f.generoMusical === x.id ? ' selected' : '') + '>' + esc(x.label) + '</option>';
    }).join('') + '</select></label>' +
    (genOtro
      ? '<input data-campo="generoMusicalTexto" placeholder="¿Qué género? («cumbia», «vals», «música de circo»)" value="' + esc(f.generoMusicalTexto) + '">'
      : '') +
    (f.generoMusical === 'auto' && f.instrumentos.length
      ? '<p class="tenue mini" style="margin-top:8px">Con lo que llevas elegido saldrá algo en la línea de <b>' +
          esc(etiquetaDeGenero(generoSugeridoAqui(), generos)) + '</b>.</p>'
      : '') +
    (generoElegido && generoElegido.energia
      ? '<p class="tenue mini" style="margin-top:8px">Se tocará ' +
          esc({ alta: 'a toda intensidad', media: 'con energía sostenida', suave: 'con delicadeza' }[generoElegido.energia]) +
          ', y el vídeo lo sabrá.</p>'
      : '') +
  '</div>';

  html += '<div class="tarjeta">' +
    '<h3><span class="paso">6</span>Duración y formato</h3>' +
    '<div class="chips">' + duraciones.map(function(d){
      return '<button class="chip' + (f.duracion === d.seconds ? ' on' : '') + '" data-accion="duracion" data-seg="' + d.seconds + '">' + esc(d.label) + '</button>';
    }).join('') + '</div>' +
    // El formato entra en el prompt de CADA imagen y de CADA clip, así que se
    // fija aquí y ya no se cambia: a mitad de producción unas tomas saldrían
    // verticales y otras apaisadas.
    '<p class="tenue mini" style="margin:14px 0 6px">Formato del vídeo. No se puede cambiar después de crear el corto.</p>' +
    '<div class="chips">' + formatos.map(function(fo){
      return '<button class="chip' + (f.formato === fo.id ? ' on' : '') + '" data-accion="formato" data-id="' + esc(fo.id) + '">' +
        esc(fo.etiqueta) + ' · ' + esc(fo.proporcion) + '</button>';
    }).join('') + '</div>' +
    '<p class="tenue mini" style="margin-top:8px">' + esc(formatoElegido(f, formatos).para) + '</p>' +
  '</div>';

  // Los modelos van justo después de la duración porque son la otra mitad de
  // la misma decisión: cuánto va a costar este corto. Y van ANTES de crear el
  // proyecto porque después ya no se pueden cambiar.
  html += '<div class="tarjeta">' +
    '<h3><span class="paso">7</span>Modelo de imagen</h3>' +
    '<p class="tenue mini" style="margin-bottom:4px">Genera los retratos maestros, el escenario y las imágenes de cada toma. De más barato a más caro.</p>' +
    '<div id="lista-modelo-imagen">' + htmlModelosImagen() + '</div>' +
  '</div>';

  html += '<div class="tarjeta">' +
    '<h3><span class="paso">8</span>Modelo de vídeo</h3>' +
    '<p class="tenue mini" style="margin-bottom:10px">Anima cada toma a partir de su imagen aprobada. De más barato a más caro.</p>' +
    '<div class="nota aviso">' +
      '<b>El vídeo es la parte cara del corto.</b> Un corto genera muchos clips, y el modelo que elijas aquí multiplica el coste de todos ellos. ' +
      'No enseñamos precios porque la tarifa depende de tu cuenta de Google Cloud, de la región y de la fecha: míralos en la facturación de Vertex AI antes de lanzar un corto de tres minutos.' +
    '</div>' +
    '<div id="lista-modelo-video">' + htmlModelosVideo() + '</div>' +
    '<p class="tenue mini" style="margin-top:10px">El modelo se fija al crear el corto y ya no se cambia: mezclar modelos a mitad de producción rompe la continuidad visual entre tomas.</p>' +
  '</div>';

  html += htmlFichasPersonaje();

  html += '<div class="tarjeta">' +
    '<h3><span class="paso">10</span>Dirección creativa</h3>' +
    '<p class="tenue mini" style="margin-bottom:10px">Escribe libremente: apariencia, vestuario, ambiente, luz, época, colores, intención emocional. No hace falta que suene a prompt técnico; el equipo lo traduce.</p>' +
    '<textarea data-campo="direccion" rows="6" placeholder="Describe libremente lo que quieres ver…">' + esc(f.direccion) + '</textarea>' +
  '</div>';

  html += '<button class="btn pri ancho grande" data-accion="crear-proyecto">Crear el corto y planificarlo</button>' +
    '<p class="tenue mini centro" style="margin-top:10px">La planificación tarda unos segundos: la IA escribe el concepto, la biblia visual y el plan de tomas.</p>';

  return html;
}

/**
 * QUÉ CAMPO DEL ENCARGO SE EDITA, según el tipo de elemento.
 *
 * La música se le pide a Google EN INGLÉS —es el único idioma
 * que entiende el modelo de audio— y guardan además una versión en español que
 * es la que se le enseña al usuario. Lo que se edita tiene que ser el que
 * viaja: corregir el español no cambiaría ni una nota.
 *
 * La misma regla está en api/prompt.js, escrita igual y sobre el mismo `kind`.
 * Una prueba comprueba que las dos listas siguen coincidiendo.
 */
var PROMPT_EN_INGLES = ['music'];

function campoDePrompt(a){
  return PROMPT_EN_INGLES.indexOf(a && a.kind) !== -1 ? 'promptEn' : 'prompt';
}

/**
 * Qué género saldría con lo que hay elegido, si se deja en automático.
 *
 * No se deduce aquí: cada instrumento del catálogo llega con su sugerencia ya
 * puesta por el servidor. Duplicar la tabla en la pantalla sería garantizar que
 * un día diga una cosa y el corto salga con otra.
 */
function generoSugeridoAqui(){
  var c = estado.catalogo || {}, f = estado.form || {};
  var id = (f.instrumentos || [])[0];
  var ins = (c.instruments || []).find(function(x){ return x.id === id; });
  return (ins && ins.suggestedGenreId) || 'cinematic';
}

function etiquetaDeGenero(id, generos){
  var g = (generos || []).find(function(x){ return x.id === id; });
  return g ? g.label : id;
}

/**
 * LAS FICHAS DE PERSONAJE.
 *
 * Por qué existen: escribir «dos chicas rubias en minifalda» en la dirección
 * creativa no bastaba. El texto llegaba al prompt, pero debajo el prompt seguía
 * diciendo «Cabello: negro azabache. Vestuario: falda larga», y el modelo se
 * queda con el dato concreto, no con la frase que dice tener prioridad.
 *
 * Eligiendo aquí, el dato se SUSTITUYE antes de escribir el prompt. Lo que se
 * deja en blanco lo decide el Director, como siempre.
 */
function cuantosInterpretes(){
  var c = estado.catalogo, f = estado.form;
  if (!c || !f) return 1;
  var forma = (c.formations || []).find(function(x){ return x.id === f.formacion; });
  var cuantos = forma ? Number(forma.performerCount) || 1 : 1;
  var tope = (c.characterTraits && c.characterTraits.max) || 4;
  return Math.max(1, Math.min(cuantos, tope));
}

/**
 * Qué banco de opciones le toca al intérprete `n` (contando desde 1).
 *
 * Tiene que dar EXACTAMENTE lo mismo que `bancoDe` en api/_lib/planificador.js:
 * si la pantalla enseña minifaldas y el Director reparte trajes, el usuario
 * elige una cosa y recibe otra. En un grupo mixto se alternan empezando por el
 * femenino, igual que allí.
 */
function bancoDeInterprete(n){
  var c = estado.catalogo, f = estado.form;
  var tipo = (c && (c.performerTypes || []).find(function(x){ return x.id === f.tipo; })) || null;
  var generos = (tipo && tipo.genderIds) || [f.genero || 'female'];
  if (generos.indexOf('mixed') !== -1) return (n - 1) % 2 === 0 ? 'femenino' : 'masculino';
  return generos.indexOf('male') !== -1 ? 'masculino' : 'femenino';
}

/** Las opciones de un rasgo para ese banco. Un rasgo sin listas separadas vale igual para todos. */
function opcionesDelRasgo(rasgo, banco){
  if (rasgo.opciones && rasgo.opciones.length) return rasgo.opciones;
  var dos = rasgo.porGenero || {};
  return dos[banco] || dos.femenino || [];
}

function fichaEn(n){
  var f = estado.form;
  if (!f.fichas[n - 1]) f.fichas[n - 1] = {};
  return f.fichas[n - 1];
}

/** Cuántos rasgos tiene rellenos una ficha, para el contador del botón. */
function rellenosDe(n){
  var ficha = estado.form.fichas[n - 1];
  if (!ficha) return 0;
  var total = 0;
  for (var k in ficha) if (ficha[k] && String(ficha[k]).trim()) total += 1;
  return total;
}

/**
 * Borra de las fichas lo que ya no existe en el banco nuevo.
 *
 * Si alguien elige «mujer», pone minifalda, y luego cambia a «hombre», esa
 * minifalda seguiría guardada y llegaría al prompt aunque el botón ya no se vea.
 * Un valor invisible que manda sobre la imagen es peor que ninguno. Lo escrito
 * a mano se respeta: si lo tecleó, lo quiere.
 */
function limpiarFichasDeOtroGenero(){
  var cat = estado.catalogo && estado.catalogo.characterTraits;
  if (!cat || !estado.form) return;
  (estado.form.fichas || []).forEach(function(ficha, i){
    if (!ficha) return;
    var banco = bancoDeInterprete(i + 1);
    (cat.rasgos || []).forEach(function(rasgo){
      if (!rasgo.porGenero || !ficha[rasgo.id]) return;
      var valido = opcionesDelRasgo(rasgo, banco);
      var otras = Object.keys(rasgo.porGenero).reduce(function(a, k){ return a.concat(rasgo.porGenero[k]); }, []);
      // Sólo se borra si el valor venía del banco del OTRO género. Un texto
      // libre no está en ninguna de las dos listas y se queda.
      if (valido.indexOf(ficha[rasgo.id]) === -1 && otras.indexOf(ficha[rasgo.id]) !== -1) {
        ficha[rasgo.id] = '';
      }
    });
  });
}

function htmlFichasPersonaje(){
  var c = estado.catalogo, f = estado.form;
  var cat = c && c.characterTraits;
  if (!cat) return '';
  var cuantos = cuantosInterpretes();
  if (f.fichaAbierta > cuantos) f.fichaAbierta = 1;

  var html = '<div class="tarjeta">' +
    '<h3><span class="paso">9</span>Los personajes</h3>' +
    '<p class="tenue mini" style="margin-bottom:10px">Elige cómo quieres que sean. ' +
    '<b>Lo que dejes en blanco lo decide el director.</b> Junto a los botones puedes escribir lo tuyo si no está en la lista.</p>';

  // Pestañas, sólo si hay más de un intérprete.
  if (cuantos > 1) {
    html += '<div class="chips" style="margin-bottom:12px">';
    for (var n = 1; n <= cuantos; n += 1) {
      var puestos = rellenosDe(n);
      // En un grupo mixto hace falta decir cuál es cuál: las opciones que se
      // ven debajo cambian, y sin la etiqueta parecería un error.
      var mixto = bancoDeInterprete(1) !== bancoDeInterprete(2);
      var quien = 'Intérprete ' + n + (mixto ? (bancoDeInterprete(n) === 'masculino' ? ' ♂' : ' ♀') : '');
      html += '<button class="chip' + (f.fichaAbierta === n ? ' on' : '') + (puestos ? ' completa' : '') + '" ' +
        'data-accion="ficha-abrir" data-n="' + n + '">' + quien +
        (puestos ? ' <span class="cuenta">' + puestos + '</span>' : '') + '</button>';
    }
    html += '</div>';
  }

  var abierta = f.fichaAbierta;
  var ficha = f.fichas[abierta - 1] || {};
  var banco = bancoDeInterprete(abierta);

  (cat.rasgos || []).forEach(function(rasgo){
    var valor = ficha[rasgo.id] || '';
    var opciones = opcionesDelRasgo(rasgo, banco);
    // Un valor escrito a mano no coincide con ningún botón: entonces ninguno
    // sale marcado y el texto se ve en su casilla, que es lo correcto.
    var enLista = opciones.indexOf(valor) !== -1;
    html += '<div style="margin-bottom:14px">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
        '<span style="font-size:12.5px;font-weight:700;color:var(--tenue)">' + esc(rasgo.etiqueta) + '</span>' +
        (valor
          ? '<button class="chip quitar" data-accion="ficha-limpiar" data-rasgo="' + rasgo.id + '">' + esc(valor) + '</button>'
          : '<span class="mini tenue">lo decide el director</span>') +
      '</div>' +
      '<div class="chips">';
    opciones.forEach(function(op){
      html += '<button class="chip' + (valor === op ? ' on' : '') + '" data-accion="ficha-rasgo" ' +
        'data-rasgo="' + rasgo.id + '" data-valor="' + esc(op) + '">' + esc(op) + '</button>';
    });
    html += '</div>' +
      '<input type="text" data-ficha-texto="' + rasgo.id + '" placeholder="…o escríbelo tú" ' +
        'style="margin-top:6px" value="' + esc(enLista ? '' : valor) + '">' +
    '</div>';
  });

  html += '<label class="campo" style="margin-top:4px"><span>Otros detalles de este intérprete</span>' +
    '<textarea data-ficha-texto="notes" rows="3" placeholder="Lo que no esté arriba: tatuajes, gafas, maquillaje, un detalle del vestuario…">' +
      esc(ficha.notes || '') + '</textarea></label>';

  if (cuantos > 1) {
    html += '<button class="btn ancho" data-accion="ficha-copiar">Copiar esta ficha a los demás intérpretes</button>' +
      '<p class="tenue mini" style="margin-top:8px">Aunque copies la ficha, el director les pone a cada uno una cara y un peinado distintos: son personas diferentes.</p>';
  }

  return html + '</div>';
}

// ───────────────────────────────────────────────────────────────────────
// Vista: proyecto (sala de producción)
// ───────────────────────────────────────────────────────────────────────

function vistaProyecto(){
  if (!estado.proyecto || estado.proyecto.id !== estado.proyectoId) {
    return '<div class="cab"><div class="cab-tit"><h1>Sala de producción</h1></div></div>' +
      htmlCargando('Abriendo el proyecto…');
  }

  var p = estado.proyecto;
  var sit = situacion(p);
  var titulo = (p.delivery && p.delivery.title) || (p.plan && p.plan.concept && p.plan.concept.title) || 'Sin título';

  var cab = '<div class="cab">' +
    '<button class="btn fantasma pequeno" data-accion="ir" data-ruta="#/proyectos" aria-label="Volver">‹</button>' +
    '<div class="cab-tit"><h1>' + esc(titulo) + '</h1>' +
    '<p>' + fmtTiempo(p.config.durationSec) + ' · ' + sit.aprobados + '/' + sit.total + ' aprobados · ' +
      esc(ETIQ_MONTAJE[(p.finalCut && p.finalCut.status) || 'pending']) + '</p></div>' +
    '<button class="btn fantasma pequeno" data-accion="refrescar" aria-label="Actualizar">⟳</button>' +
  '</div>';

  var tabs = '<div class="subtabs">' +
    ['produccion','plan','montaje'].map(function(t){
      var etiq = t === 'produccion' ? 'Producción' : (t === 'plan' ? 'Plan' : 'Montaje');
      return '<button class="' + (estado.subtab === t ? 'on' : '') + '" data-accion="subtab" data-tab="' + t + '">' + etiq + '</button>';
    }).join('') + '</div>';

  var colA = '<div class="col col-a' + (estado.subtab === 'plan' ? ' on' : '') + '" id="col-a">' + panelPlan(p) + '</div>';
  var colB = '<div class="col col-b' + (estado.subtab === 'produccion' ? ' on' : '') + '" id="col-b">' + panelProduccion(p, sit) + '</div>';
  var colC = '<div class="col col-c' + (estado.subtab === 'montaje' ? ' on' : '') + '" id="col-c">' + panelMontaje(p, sit) + '</div>';

  return cab + tabs + '<div class="sala">' + colA + colB + colC + '</div>';
}

// ── Columna central: producción y revisión ─────────────────────────────

function panelProduccion(p, sit){
  var html = '';

  html += '<div class="tarjeta hero">' +
    '<div class="hero-fila">' +
      '<div class="hero-txt">' +
        '<p class="sube">Producción</p>' +
        '<h2 style="font-size:16px">' + esc(sit.etapas.filter(function(e){ return e.estado === 'active'; }).map(function(e){ return e.label; })[0] || 'Todo aprobado') + '</h2>' +
        '<p class="tenue mini">' + sit.aprobados + ' de ' + sit.total + ' activos aprobados</p>' +
      '</div>' + htmlAnillo(sit.porcentaje) +
    '</div>' +
    '<div style="margin-top:14px">' + htmlChipsEtapas(sit) + '</div>' +
    (sit.enRevision.length
      ? '<div class="nota aviso" style="margin-top:14px"><b>' + sit.enRevision.length +
        (sit.enRevision.length === 1 ? ' elemento espera' : ' elementos esperan') + ' tu decisión.</b> Una generación terminada NO queda aprobada sola.</div>'
      : '') +
    (sit.siguiente
      ? '<button class="btn pri ancho grande" style="margin-top:14px" data-accion="continuar" data-id="' + esc(p.id) + '">Continuar Producción</button>'
      : (sit.listoParaMontar
        ? '<button class="btn pri ancho grande" style="margin-top:14px" data-accion="subtab" data-tab="montaje">Ir al montaje final</button>'
        : '')) +
  '</div>';

  // Actualizar las instrucciones de un corto empezado. Va aquí arriba y no
  // escondido: mientras el equipo de dirección siga mejorando, un corto de hace
  // dos semanas lleva dentro las instrucciones de hace dos semanas.
  html += '<div class="tarjeta">' +
    '<h3>Instrucciones del corto</h3>' +
    '<p class="tenue mini" style="margin-bottom:10px">Los encargos que lee la IA se escribieron cuando creaste este corto. ' +
      'Si desde entonces se ha mejorado el equipo de dirección, aquí los pones al día ' +
      '<b>sin tocar tus tomas ni tus aprobaciones</b>: lo que cambie se marcará como desactualizado y decides tú si lo regeneras.</p>' +
    '<button class="btn ancho" data-accion="actualizar-plan" data-id="' + esc(p.id) + '"' +
      (estado.trabajando ? ' disabled' : '') + '>Actualizar las instrucciones a la versión de hoy</button>' +
  '</div>';

  html += htmlCola(p);

  html += '<div class="tarjeta" id="caja-revision">' + htmlRevision(p) + '</div>';

  // Lista completa, agrupada por etapa para que en el móvil no sea un muro.
  html += '<div class="tarjeta"><h3>Todos los activos</h3>';
  ETAPAS_ACTIVOS.forEach(function(etapa){
    var lista = activosDeEtapa(p, etapa);
    if (!lista.length) return;
    var aprobados = lista.filter(cuenta).length;
    var abierta = etapaAbierta(p, etapa);
    var completa = etapaCompleta(p, etapa);
    var desplegar = abierta && !completa;
    html += '<details' + (desplegar ? ' open' : '') + '>' +
      '<summary>' + esc(ETIQ_ETAPA[etapa]) + ' · ' + aprobados + '/' + lista.length +
        (!abierta ? ' · bloqueada' : (completa ? ' · completa' : '')) + '</summary>' +
      '<div class="cuerpo">' +
        (!abierta ? '<p class="nota">Esta etapa se abre cuando la anterior esté aprobada entera.</p>' : '') +
        // Generar en lote, que es lo tonto de hacer a mano. Aprobar sigue
        // siendo de uno en uno: eso es la promesa del producto.
        (abierta && !completa && !estado.cola
          ? '<button class="btn ancho" style="margin-bottom:10px" data-accion="cola-etapa" data-etapa="' + esc(etapa) + '">' +
            'Generar ' + (lista.length - aprobados) + ' de ' + esc(ETIQ_ETAPA[etapa]).toLowerCase() + ' en cola</button>' +
            '<p class="tenue mini" style="margin:-4px 0 10px">Se lanzan de una en una y en orden. Tú vas aprobando o regenerando cada una según salga.</p>'
          : '') +
        '<div class="filas">' + lista.map(function(a){
          return htmlFilaActivo(a, estado.activoSel === a.id);
        }).join('') + '</div>' +
      '</div></details>';
  });
  html += '</div>';

  html += '<div class="tarjeta"><h3>Actividad</h3><ul class="eventos">' +
    (p.events || []).slice(-18).reverse().map(function(ev){
      return '<li><time>' + esc(fmtHora(ev.at)) + '</time><span>' + esc(ev.message) + '</span></li>';
    }).join('') + '</ul></div>';

  return html;
}

/** La tarjeta de revisión: el corazón de la herramienta. */
function htmlRevision(p){
  var a = activos(p).find(function(x){ return x.id === estado.activoSel; });
  if (!a) {
    var sit = situacion(p);
    if (sit.siguiente) {
      return '<h3>Revisión</h3><p class="tenue mini">Elige un activo de la lista, o pulsa «Continuar Producción» para ir directo a lo siguiente.</p>';
    }
    return '<h3>Revisión</h3><p class="tenue mini">No queda nada por revisar: todos los activos están aprobados.</p>';
  }

  var medio = MEDIO_DE_TIPO[a.kind] || 'image';
  var gen = generacionVista(a);
  var puerta = puedeGenerar(p, a);
  var bloqueantes = dependenciasQueFaltan(p, a);
  var generando = (a.status === 'generating');
  var esperaDecision = !!(gen && gen.status === 'review');

  var html = '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">' +
    '<div style="flex:1;min-width:0">' +
      '<p class="sube">' + esc(ETIQ_MEDIO[medio]) + ' · ' + esc(ETIQ_ETAPA[a.stage]) + '</p>' +
      '<h2>' + esc(a.label) + '</h2>' +
      '<p class="tenue mini">' + esc(a.spec && a.spec.objective ? a.spec.objective : '') + '</p>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">' +
      htmlEtiquetaActivo(a) + (a.locked ? '<span class="etiq bloq">Bloqueado</span>' : '') +
    '</div>' +
  '</div>';

  if (a.stale) {
    html += '<div class="nota mala">' + esc(a.staleReason || 'Un activo del que depende ha cambiado.') +
      ' Revísalo y vuelve a generarlo si ya no encaja.</div>';
  }
  if (bloqueantes.length) {
    html += '<div class="nota aviso">Este activo se apoya en material que todavía no está aprobado: <b>' +
      esc(bloqueantes.map(function(x){ return x.label; }).join(', ')) + '</b>.</div>';
  }

  // ── Previsualización del medio ──
  html += '<div class="medio">';
  if (generando) {
    html += '<div class="medio-vacio"><div class="girando"></div>' +
      '<p><b>Generando…</b></p>' +
      '<p>La IA está trabajando. Puede tardar varios minutos si es un clip de vídeo. ' +
      'Puedes revisar otras cosas mientras tanto: la pantalla se actualiza sola.</p></div>';
  } else if (!gen || !gen.file || !gen.file.url) {
    html += '<div class="medio-vacio"><div style="font-size:30px">' +
      (medio === 'image' ? '🖼️' : medio === 'video' ? '🎞️' : '🎵') + '</div>' +
      '<p>Todavía no hay ninguna generación.</p>' +
      '<p>' + esc(a.spec && a.spec.objective ? a.spec.objective : '') + '</p></div>';
  } else if (medio === 'image') {
    html += '<img src="' + esc(gen.file.url) + '" alt="Generación ' + esc(gen.index) + ' de ' + esc(a.label) + '">';
  } else if (medio === 'video') {
    html += '<video src="' + esc(gen.file.url) + '" controls playsinline preload="metadata"></video>';
  } else {
    html += '<audio src="' + esc(gen.file.url) + '" controls preload="metadata"></audio>';
  }
  html += '</div>';

  // ── Navegador de generaciones: cada intento se conserva y se puede comparar ──
  if (a.generations && a.generations.length) {
    html += '<div class="chips" style="margin-bottom:10px">' + a.generations.map(function(g){
      var marca = g.id === a.approvedGenerationId ? ' ✓'
        : g.status === 'rejected' ? ' ✕'
        : g.status === 'failed' ? ' !'
        : g.status === 'generating' ? ' …' : '';
      return '<button class="chip' + (gen && gen.id === g.id ? ' on' : '') + '" data-accion="ver-gen" data-gen="' + esc(g.id) + '">#' + esc(g.index) + marca + '</button>';
    }).join('') + '</div>';
  }

  if (gen) {
    var prov = gen.provider ? ((gen.provider.name || '') + (gen.provider.model ? ' · ' + gen.provider.model : '') + (gen.provider.formato ? ' · ' + gen.provider.formato : '')) : '';
    var dur = gen.file && gen.file.durationSec ? ' · ' + Number(gen.file.durationSec).toFixed(1) + ' s' : '';
    var peso = gen.file && gen.file.bytes ? ' · ' + fmtBytes(gen.file.bytes) : '';
    var tardo = gen.elapsedMs ? ' · tardó ' + Math.round(gen.elapsedMs / 1000) + ' s' : '';
    html += '<p class="tenue mini" style="margin-bottom:10px">Generación #' + esc(gen.index) +
      (gen.id === a.approvedGenerationId ? ' — <b style="color:var(--ok)">APROBADA</b>' : '') +
      (gen.status === 'rejected' ? ' — descartada' : '') +
      (gen.status === 'failed' ? ' — <b style="color:var(--error)">falló</b>' : '') +
      (prov ? ' · ' + esc(prov) : '') + esc(dur + peso + tardo) + '</p>';
  }

  if (gen && gen.error) html += '<div class="nota mala">' + esc(gen.error) + '</div>';

  // ── Las dos decisiones ──
  var textoGenerar = (a.generations && a.generations.length) ? 'Regenerar' : 'Generar';
  var puedePulsarGenerar = !estado.trabajando && !generando && (puerta.ok || a.locked);

  html += '<div class="acciones">' +
    '<button class="btn ok" data-accion="aprobar" data-activo="' + esc(a.id) + '" data-gen="' + esc(gen ? gen.id : '') + '"' +
      (esperaDecision && !estado.trabajando ? '' : ' disabled') + '>Aprobar</button>' +
    '<button class="btn" data-accion="generar" data-activo="' + esc(a.id) + '"' +
      (puedePulsarGenerar ? '' : ' disabled') + '>' + textoGenerar + '</button>' +
  '</div>';

  // CON QUÉ MODELO SE GENERA ESTO, aquí mismo. Los selectores están también en
  // la ficha del corto, pero la ficha vive en otra pestaña: el usuario los buscó
  // mirando el elemento que le fallaba y no los encontró. Y es que éste es el
  // sitio donde de verdad se decide cambiar de modelo — delante de un clip que
  // se niega a salir.
  html += htmlModeloDelActivo(p, a);

  if (esperaDecision) {
    html += '<button class="btn fantasma ancho pequeno" style="margin-top:9px" data-accion="rechazar" data-activo="' + esc(a.id) + '" data-gen="' + esc(gen.id) + '">Descartar esta generación</button>';
  }
  if (a.locked) {
    html += '<div class="nota" style="margin-top:11px">Este activo está aprobado y bloqueado: es la versión oficial del corto. ' +
      'Al regenerarlo se desbloquea y todo lo que dependa de él quedará marcado como desactualizado' +
      (dependientes(p, a.id).length ? ' (' + dependientes(p, a.id).length + ' activos)' : '') + '.</div>';
  } else if (!puerta.ok && !generando) {
    html += '<div class="nota" style="margin-top:11px">' + esc(puerta.motivo) + '</div>';
  }
  if (esperaDecision) {
    html += '<div class="nota aviso" style="margin-top:11px">Esta generación ha terminado bien, pero <b>no está aprobada</b>. Nada que dependa de ella puede empezar hasta que lo decidas.</div>';
  }

  // ── El prompt y las referencias, consultables Y EDITABLES ──
  //
  // Editables porque cuando un filtro de contenido bloquea una generación, el
  // error dice «cambia la descripción de la toma» — y hasta ahora no había
  // ninguna forma de cambiarla. Un filtro no se pelea: se cambia la palabra que
  // lo dispara y se vuelve a pedir.
  var spec = a.spec || {};
  var campo = campoDePrompt(a);
  var promptTexto = spec[campo] || (gen && gen.prompt) || spec.prompt || '';
  var negativo = spec.negativePrompt || (gen && gen.negativePrompt) || '';
  var editado = !!spec.promptEditado;
  var editando = (estado.editandoPrompt === a.id);
  var refs = (gen && gen.referenceAssetIds) || spec.referenceAssetIds || [];
  var porId = {};
  activos(p).forEach(function(x){ porId[x.id] = x; });

  html += '<details' + (editando ? ' open' : '') + ' style="margin-top:12px">' +
    '<summary>Ver' + (editado ? ' o editar' : ' y editar') + ' el prompt' +
      (editado ? ' · reescrito a mano' : '') + '</summary><div class="cuerpo">' +
    '<h4>Prompt' + (campo === 'promptEn' ? ' (en inglés: es el idioma que entiende el modelo de audio)' : '') + '</h4>';

  if (editando) {
    html += '<textarea id="editor-prompt" rows="12" spellcheck="false" ' +
        'style="font-family:ui-monospace,monospace;font-size:12.5px">' + esc(promptTexto) + '</textarea>' +
      '<h4>Prompt negativo</h4>' +
      '<textarea id="editor-negativo" rows="3" spellcheck="false" placeholder="Lo que NO quieres ver. Puede quedarse vacío." ' +
        'style="font-family:ui-monospace,monospace;font-size:12.5px">' + esc(negativo) + '</textarea>' +
      '<div class="nota" style="margin:4px 0 10px">Si te lo bloquearon los filtros de contenido, cambia la palabra que lo dispara y vuelve a generar. ' +
        'El texto del Director se guarda: siempre puedes volver a él.</div>' +
      '<button class="btn pri ancho" data-accion="guardar-prompt" data-activo="' + esc(a.id) + '">Guardar el prompt</button>' +
      '<button class="btn fantasma ancho pequeno" style="margin-top:8px" data-accion="cancelar-prompt">Cancelar</button>';
  } else {
    html += '<pre>' + esc(promptTexto) + '</pre>' +
      (negativo ? '<h4>Prompt negativo</h4><pre>' + esc(negativo) + '</pre>' : '') +
      '<button class="btn ancho pequeno" data-accion="editar-prompt" data-activo="' + esc(a.id) + '">Editar el prompt</button>' +
      (editado
        ? '<button class="btn fantasma ancho pequeno" style="margin-top:8px" data-accion="restaurar-prompt" data-activo="' + esc(a.id) + '">Volver al prompt original del Director</button>'
        : '');
  }

  // EL MISMO ENCARGO EN ESPAÑOL, para leerlo. La música se le pide a Google en
  // inglés, y ése es el que se edita porque es el que viaja;
  // pero el producto está en español y el usuario tiene derecho a ver qué se ha
  // encargado en su idioma sin traducir un párrafo de cabeza (PRD §19).
  if (campo === 'promptEn' && spec.prompt) {
    html += '<h4>Lo mismo en español</h4><pre>' + esc(spec.prompt) + '</pre>' +
      '<p class="tenue mini" style="margin:-4px 0 10px">Esto es sólo para que lo leas. Lo que se manda es el de arriba, ' +
      'porque el modelo de audio rechaza la petición si detecta cualquier otro idioma.</p>';
  }

  html += (refs.length ? '<h4>Referencias aprobadas utilizadas</h4><ul class="reglas">' + refs.map(function(id){
      return '<li>' + esc(porId[id] ? porId[id].label : id) + '</li>';
    }).join('') + '</ul>' : '') +
    (spec.continuityNotes && spec.continuityNotes.length
      ? '<h4>Continuidad</h4><ul class="reglas">' + spec.continuityNotes.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>'
      : '') +
    (gen && gen.seed !== undefined && gen.seed !== null ? '<p class="tenue mini">Semilla: ' + esc(gen.seed) + '</p>' : '') +
  '</div></details>';

  if (a.generations && a.generations.length > 1) {
    html += '<details><summary>Historial de generaciones (' + a.generations.length + ')</summary><div class="cuerpo"><div class="filas">' +
      a.generations.slice().reverse().map(function(g){
        var etiq = g.status === 'approved' ? 'aprobada'
          : g.status === 'rejected' ? 'descartada'
          : g.status === 'failed' ? 'falló'
          : g.status === 'generating' ? 'generando…' : 'en revisión';
        return '<button class="fila' + (gen && gen.id === g.id ? ' sel' : '') + '" data-accion="ver-gen" data-gen="' + esc(g.id) + '">' +
          '<span class="nom">Generación #' + esc(g.index) + '<small>' + esc(fmtFecha(g.createdAt)) + '</small></span>' +
          '<span class="etiq">' + esc(etiq) + '</span></button>';
      }).join('') +
      '</div><p class="tenue mini" style="margin-top:9px">Sólo la versión aprobada se usa en la producción; las demás se conservan para poder comparar.</p></div></details>';
  }

  return html;
}

/**
 * El selector del modelo que le toca a ESTE elemento.
 *
 * A una imagen se le ofrecen los modelos de imagen y a un clip los de vídeo:
 * enseñar los dos aquí sería enseñar uno que no hace nada. La música no lleva
 * selector porque sólo hay un compositor.
 */
function htmlModeloDelActivo(p, a){
  var c = estado.catalogo || {};
  var esVideo = (a.kind === 'clip');
  var lista = esVideo ? c.modelosVideo : c.modelosImagen;
  if (a.kind === 'music' || !lista || !lista.length) return '';

  var cfg = p.config || {};
  var actual = esVideo ? cfg.videoModelId : cfg.imageModelId;
  return '<label class="campo" style="margin-top:11px"><span>Modelo de ' +
      (esVideo ? 'vídeo' : 'imagen') + ' con el que se generará</span>' +
      '<select data-modelo="' + (esVideo ? 'video' : 'imagen') + '" data-id="' + esc(p.id) + '">' +
      lista.map(function(m){
        return '<option value="' + esc(m.id) + '"' + (actual === m.id ? ' selected' : '') + '>' +
          esc(m.etiqueta || m.id) + '</option>';
      }).join('') + '</select></label>' +
    '<p class="tenue mini" style="margin-top:-4px;margin-bottom:2px">Vale para todo el corto. ' +
      'Lo ya aprobado no se toca; lo que generes a partir de ahora usará el nuevo.</p>';
}

// ── Columna izquierda: ficha del proyecto y plan completo ──────────────

function panelPlan(p){
  var plan = p.plan || {};
  var cfg = p.config || {};
  var concepto = plan.concept || {};
  var biblia = plan.visualBible || {};
  var html = '';

  // Ficha de configuración: lo que el usuario pidió, tal cual.
  html += '<div class="tarjeta"><h3>Configuración</h3>' +
    htmlDatos([
      ['Duración', fmtTiempo(cfg.durationSec)],
      ['Instrumentos', (biblia.instrument && biblia.instrument.names) ? biblia.instrument.names.join(' + ') : (cfg.instrumentIds || []).join(', ')],
      ['Formación', cfg.formationId],
      ['Intérprete', cfg.performerTypeId],
      ['Escenario', cfg.scenarioCustom || cfg.scenarioId],
      ['Estilo visual', cfg.visualStyleCustom || cfg.visualStyleId],
      ['Formato', nombreFormato(cfg.formatoId)],
      ['Creado', fmtFecha(p.createdAt)]
    ]) +
    // LOS MODELOS SÍ SE CAMBIAN, con el corto ya empezado. Antes no: «se eligen
    // al crear el corto y no se pueden cambiar», decía aquí mismo, porque
    // mezclarlos puede romper la continuidad entre tomas. Sigue siendo verdad,
    // pero la decisión es del usuario y él la quiere: «debería poder estar
    // libre, para yo intercambiar generaciones entre modelos». Y hay una razón
    // práctica encima — cuando un modelo rechaza un clip una y otra vez, poder
    // probar otro es la diferencia entre seguir o tirar el corto entero.
    '<label class="campo" style="margin-top:12px"><span>Modelo de imagen</span>' +
      '<select data-modelo="imagen" data-id="' + esc(p.id) + '">' +
      ((estado.catalogo && estado.catalogo.modelosImagen) || []).map(function(m){
        return '<option value="' + esc(m.id) + '"' + (cfg.imageModelId === m.id ? ' selected' : '') + '>' +
          esc(m.etiqueta || m.id) + '</option>';
      }).join('') + '</select></label>' +
    '<label class="campo"><span>Modelo de vídeo</span>' +
      '<select data-modelo="video" data-id="' + esc(p.id) + '">' +
      ((estado.catalogo && estado.catalogo.modelosVideo) || []).map(function(m){
        return '<option value="' + esc(m.id) + '"' + (cfg.videoModelId === m.id ? ' selected' : '') + '>' +
          esc(m.etiqueta || m.id) + '</option>';
      }).join('') + '</select></label>' +
    '<p class="tenue mini" style="margin-top:8px">Cámbialos cuando quieras. Lo que ya aprobaste no se toca ni se pierde: ' +
      'sigue siendo lo oficial, hecho con el modelo con el que se hizo. Lo que generes a partir de ahora usará el nuevo, ' +
      'y en el historial de cada elemento se ve con cuál salió cada intento.<br>' +
      'Ten en cuenta que dos modelos distintos no dibujan igual, así que mezclarlos puede notarse entre tomas. ' +
      'El formato sí se queda fijo: cambiarlo dejaría unas tomas verticales y otras apaisadas.</p>' +
    // Si el corto salió mal, aquí es donde se está mirando cuando se decide
    // tirarlo. Va al final del bloque de configuración y no junto a los
    // botones de producir, para que no se toque por error.
    '<button class="btn fantasma ancho" style="margin-top:14px" ' +
      'data-accion="borrar-proyecto" data-id="' + esc(p.id) + '">Borrar este corto y todo su material</button>' +
    (cfg.creativeDirection
      ? '<h4 style="margin-top:12px">Dirección creativa</h4><p class="mini" style="margin-top:6px;color:#cfd0ee">' + esc(cfg.creativeDirection) + '</p>'
      : '') +
  '</div>';

  html += '<div class="tarjeta"><h3>Concepto</h3>' +
    (concepto.logline ? '<p class="mini" style="margin-bottom:10px;color:#dcdaf7">' + esc(concepto.logline) + '</p>' : '') +
    htmlDatos([
      ['Título', concepto.title],
      ['Intención', concepto.emotionalIntent],
      ['Arco', concepto.emotionalArc],
      ['Atmósfera', (concepto.mood || []).join(' · ')],
      ['Paleta', (concepto.palette || []).join(' · ')],
      ['Luz', concepto.timeOfDay],
      ['Planificado por', plan.plannedBy === 'claude' ? 'Claude' : 'Equipo interno (determinista)']
    ]) +
  '</div>';

  if (biblia.character || biblia.environment) {
    var per = biblia.character || {}, ent = biblia.environment || {}, ins = biblia.instrument || {}, luz = biblia.lighting || {}, est = biblia.aesthetic || {};
    html += '<div class="tarjeta"><h3>Biblia visual</h3>' +
      htmlDatos([
        ['Personaje', per.summary], ['Rostro', per.face], ['Cabello', per.hair],
        ['Vestuario', per.wardrobe], ['Complexión', per.build],
        ['Instrumento', (ins.names || []).join(' + ') + (ins.appearance ? ' — ' + ins.appearance : '')],
        ['Posición', ins.positioning],
        ['Escenario', ent.location], ['Elementos', (ent.primaryElements || []).join(', ')],
        ['Iluminación', [luz.direction, luz.intensity].filter(Boolean).join('; ')],
        ['Tratamiento', est.treatment]
      ]) +
      ((biblia.continuityRules && biblia.continuityRules.length)
        ? '<h4 style="margin-top:12px">Reglas de continuidad</h4><ul class="reglas" style="margin-top:6px">' +
          biblia.continuityRules.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>'
        : '') +
    '</div>';
  }

  if (plan.shots && plan.shots.length) {
    var ec = plan.economics || {};
    html += '<div class="tarjeta"><h3>Plan de tomas</h3>' +
      '<p class="tenue mini" style="margin-bottom:10px">' +
        (ec.uniqueShots || plan.shots.length) + ' tomas únicas · ' + (ec.timelineSlots || 0) + ' bloques · ' +
        (ec.reusedSlots || 0) + ' reutilizaciones · ' + (ec.generatedFootageSec || 0) + ' s generados para ' +
        (ec.runtimeSec || cfg.durationSec || 0) + ' s de corto.</p>' +
      '<div class="desliza"><table><thead><tr>' +
        '<th>Toma</th><th>Bloque</th><th>Plano</th><th>Cámara</th><th>Dur.</th><th>Clips</th><th>Propósito</th>' +
      '</tr></thead><tbody>' +
      plan.shots.map(function(s){
        return '<tr><td>' + esc(s.label) + '</td>' +
          '<td>' + esc(ETIQ_PULSO[s.beat] || s.beat) + '</td>' +
          '<td>' + esc(String(s.shotType || '').replace(/_/g,' ')) + '</td>' +
          '<td>' + esc(String(s.cameraMove || '').replace(/_/g,' ')) + '</td>' +
          '<td>' + esc(s.durationSec) + ' s</td>' +
          '<td>' + esc((s.clips || []).map(function(c){ return c.suffix || c.label || ''; }).join(', ')) + '</td>' +
          '<td>' + esc(s.purpose) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  if (plan.timeline && plan.timeline.length) {
    html += '<div class="tarjeta"><h3>Línea de tiempo</h3><ul class="tiempos">' +
      plan.timeline.map(function(t){
        return '<li' + (t.reused ? ' class="rep"' : '') + '>' +
          '<span class="tc">' + esc(fmtTiempo(t.startSec)) + '</span>' +
          '<span class="cl">' + esc(String(t.clipId || '').replace(/_/g,' ')) + '</span>' +
          '<span class="tenue">' + esc(t.durationSec) + ' s</span>' +
          '<span class="tenue">' + esc(ETIQ_TRANSICION[t.transitionIn] || t.transitionIn || '') + '</span>' +
          (t.reused ? '<span class="etiq">reutilizado</span>' : '') +
        '</li>';
      }).join('') + '</ul></div>';
  }

  if (plan.music) {
    var mu = plan.music || {};
    html += '<div class="tarjeta"><h3>Música</h3>' +
      htmlDatos([
        ['Título', mu.title], ['Estilo', mu.style], ['Carácter', mu.mood],
        ['Tonalidad', [mu.key, mu.scale, mu.tempoBpm ? mu.tempoBpm + ' BPM' : ''].filter(Boolean).join(' · ')],
        ['Estructura', mu.structure],
        ['Instrumentación', (mu.instrumentation || []).join(', ')],
        ['Género', mu.genre && mu.genre.label]
      ]) +
      '<p class="tenue mini" style="margin-top:8px">El corto es instrumental: sin voz, sin coros y sin narración.</p>' +
    '</div>';
  }

  if (plan.notes) {
    var n = plan.notes;
    html += '<div class="tarjeta"><h3>Notas del equipo</h3>' +
      htmlDatos([
        ['Director', n.director], ['Productor', n.producer], ['Dirección de arte', n.artDirector],
        ['Fotografía', n.cinematographer], ['Guion', n.screenwriter], ['Montaje', n.editor]
      ]) + '</div>';
  }

  return html;
}

// ── Columna derecha: montaje, previsualización y entrega ───────────────

function panelMontaje(p, sit){
  var corte = p.finalCut || { status:'pending' };
  var entrega = p.delivery || {};
  var html = '';

  var faltan = estado.faltanParaMontar;
  if (!faltan) {
    faltan = sit.filas.filter(function(a){ return !cuenta(a); }).map(function(a){ return a.label; });
  }

  html += '<div class="tarjeta"><h3>Montaje final</h3>';

  if (faltan.length) {
    html += '<div class="nota aviso">El montador sólo recibe activos aprobados. Faltan <b>' + faltan.length + '</b>: ' +
      esc(faltan.slice(0, 6).join(', ')) + (faltan.length > 6 ? ' y ' + (faltan.length - 6) + ' más' : '') + '.</div>';
  } else if (corte.status === 'pending') {
    html += '<div class="nota buena">Todo está aprobado. Monta la previsualización para verla entera antes de exportar.</div>';
  }

  if (corte.status === 'building') {
    html += '<div class="nota"><span class="punto"></span> Montando el corto. Esto tarda unos minutos; puedes seguir revisando otras cosas.</div>';
  }
  if (corte.status === 'failed') {
    html += '<div class="nota mala">' + esc(corte.error || 'El montaje falló y el servidor no dijo por qué.') + '</div>';
  }
  if (corte.status === 'review') {
    html += '<div class="nota aviso">La previsualización está lista pero <b>no está aprobada</b>. Míralas entera antes de exportar el MP4.</div>';
  }

  html += '<div class="acciones">' +
    '<button class="btn" data-accion="montar"' +
      ((faltan.length || corte.status === 'building' || estado.trabajando) ? ' disabled' : '') + '>' +
      (corte.preview ? 'Volver a montar' : 'Montar previsualización') + '</button>' +
  '</div></div>';

  if (corte.preview && corte.preview.url) {
    html += '<div class="tarjeta"><h3>Previsualización</h3>' +
      '<div class="medio"><video src="' + esc(corte.preview.url) + '" controls playsinline preload="metadata"></video></div>' +
      '<p class="tenue mini">' + esc(fmtBytes(corte.preview.bytes)) + ' · ' +
        Math.round(corte.preview.durationSec || 0) + ' s' +
        (corte.preview.width ? ' · ' + corte.preview.width + '×' + corte.preview.height : '') +
        (corte.builtAt ? ' · montado ' + esc(fmtFecha(corte.builtAt)) : '') + '</p>' +
    '</div>';
  }

  if (corte.edl && corte.edl.length) {
    html += '<div class="tarjeta"><h3>Lista de cortes</h3><ul class="tiempos">' +
      corte.edl.map(function(e){
        return '<li' + (e.reused ? ' class="rep"' : '') + '>' +
          '<span class="tc">' + esc(e.timecode || fmtTiempo(e.startSec)) + '</span>' +
          '<span class="cl">' + esc(e.label) + '</span>' +
          '<span class="tenue">' + esc(e.durationSec) + ' s</span>' +
          (e.reused ? '<span class="etiq">reutilizado</span>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  // Metadatos de entrega. Se pintan en su propio contenedor porque el
  // refresco automático no debe tocar un campo que se está escribiendo.
  html += '<div class="tarjeta" id="caja-entrega">' + htmlEntrega(p, corte, entrega) + '</div>';

  if (corte['export'] && corte['export'].url) {
    html += '<div class="tarjeta"><h3>MP4 final</h3>' +
      '<div class="nota buena">El corto está exportado y listo para publicar.</div>' +
      // El paquete va PRIMERO y en grande: es lo que hace falta para publicar
      // —el vídeo y el texto en una sola descarga— y bajar el MP4 suelto es la
      // opción de después, no la principal.
      (corte.paquete && corte.paquete.url
        ? enlaceDeDescarga(corte.paquete.url, 'Descargar el paquete (.zip)', 'btn pri ancho grande') +
          '<p class="tenue mini centro" style="margin-top:8px">El MP4 y un archivo de texto con el título, ' +
            'la descripción y los hashtags, listos para copiar y pegar. ' + esc(fmtBytes(corte.paquete.bytes)) + '</p>' +
          enlaceDeDescarga(corte['export'].url, 'Sólo el MP4', 'btn ancho', 'margin-top:10px')
        : enlaceDeDescarga(corte['export'].url, 'Descargar MP4', 'btn pri ancho grande')) +
      notaDeDescarga((corte.paquete && corte.paquete.url) || corte['export'].url,
        (corte.paquete && corte.paquete.nombre) || null) +
      '<p class="tenue mini centro" style="margin-top:8px">' + esc(fmtBytes(corte['export'].bytes)) + ' · ' +
        Math.round(corte['export'].durationSec || 0) + ' s' +
        (corte.exportedAt ? ' · exportado ' + esc(fmtFecha(corte.exportedAt)) : '') + '</p>' +
    '</div>';
  }

  return html;
}

function htmlEntrega(p, corte, entrega){
  var listoParaEntregar = (corte.status === 'review' || corte.status === 'approved' || corte.status === 'exported');
  return '<h3>Entrega</h3>' +
    '<label class="campo"><span>Título</span>' +
      '<input type="text" id="e-titulo" maxlength="120" value="' + esc(entrega.title || '') + '"></label>' +
    '<label class="campo"><span>Descripción</span>' +

/** El diagnóstico se pinta de forma genérica: sirva la forma que sirva la respuesta. */
function htmlSalud(s){
  if (!s) return '<p class="tenue mini">Sin comprobar todavía.</p>';
  if (s.__error) return '<div class="nota mala">' + esc(s.__error) + '</div>';

  function valor(v){
    if (v === true) return '<span class="etiq approved">OK</span>';
    if (v === false) return '<span class="etiq caduco">NO</span>';
    if (v === null || v === undefined) return '<span class="etiq">—</span>';
    if (typeof v === 'object') return '<span class="mini">' + esc(JSON.stringify(v)) + '</span>';
    return '<span class="mini">' + esc(v) + '</span>';
  }

  var filas = Object.keys(s).map(function(k){
    return '<div><dt>' + esc(k) + '</dt><dd>' + valor(s[k]) + '</dd></div>';
  }).join('');

  return '<dl class="datos">' + filas + '</dl>';
}

/** Envuelve una acción: bloquea los botones, refresca y enseña el error real. */
async function ejecutar(fn){
  if (estado.trabajando) return;
  estado.trabajando = true;
  pintar();
  try { await fn(); }
  catch (e) { avisarError(e); }
  finally {
    estado.trabajando = false;
    pintar();
  }
}

async function crearProyecto(){
  var f = estado.form;
  if (!f.instrumentos.length) { avisar('Elige al menos un instrumento.'); return; }
  if (f.escenario === 'other' && !f.escenarioTexto.trim()) { avisar('Describe el escenario personalizado.'); return; }
  if (f.estilo === 'other' && !f.estiloTexto.trim()) { avisar('Describe el estilo visual personalizado.'); return; }
  if (f.generoMusical === 'other' && !f.generoMusicalTexto.trim()) { avisar('Escribe qué género musical quieres.'); return; }

  var config = {
    instrumentIds: f.instrumentos.slice(),
    formationId: f.formacion,
    performerGenderId: f.genero,
    performerTypeId: f.tipo,
    scenarioId: f.escenario,
    visualStyleId: f.estilo,
    creativeDirection: f.direccion.trim(),
    durationSec: f.duracion
  };
  if (f.formato) config.formatoId = f.formato;
  if (f.escenarioTexto.trim()) config.scenarioCustom = f.escenarioTexto.trim();
  if (f.estiloTexto.trim()) config.visualStyleCustom = f.estiloTexto.trim();
  if (f.generoMusical) config.musicGenreId = f.generoMusical;
  if (f.generoMusicalTexto.trim()) config.musicGenreCustom = f.generoMusicalTexto.trim();
  // Sólo se envían las fichas con algo dentro; el resto son huecos que el
  // Director rellena. Se conserva la posición: la ficha 2 es del intérprete 2.
  var fichas = (f.fichas || []).slice(0, cuantosInterpretes()).map(function(x){
    var limpia = {};
    for (var k in (x || {})) if (x[k] && String(x[k]).trim()) limpia[k] = String(x[k]).trim();
    return Object.keys(limpia).length ? limpia : null;
  });
  if (fichas.some(Boolean)) config.performers = fichas;
  // Sólo se mandan si hay algo que mandar: un catálogo sin modelos (o un
  // servidor anterior a esta pantalla) debe seguir creando cortos con el
  // modelo que tenga por defecto, no recibir una cadena vacía y responder 400.
  if (f.modeloImagen) config.imageModelId = f.modeloImagen;
  if (f.modeloVideo) config.videoModelId = f.modeloVideo;

  await ejecutar(async function(){
    var d = await api.crear(config);
    var p = desenvolver(d, ['project','proyecto']);
    if (!p || !p.id) throw new Error('El servidor creó algo pero no devolvió el proyecto.');
    estado.proyecto = p;
    estado.proyectoId = p.id;
    estado.form = null;
    await cargarResumenes();
    avisar('Corto creado y planificado. Ahora te toca aprobar.', 'ok');
    irA('#/proyecto/' + p.id);
  });
}

/**
 * Pone al día los encargos de un corto ya empezado.

 * Se avisa de cuántos cambian y de que lo aprobado no se toca, porque «voy a

 */
async function accionActualizarPlan(id){

    'quedará marcado como desactualizado y tú decides si lo regeneras.\n\n¿Continuar?'
  )) return;
  await ejecutar(async function(){

    await cargarProyecto(id);

  });

/**
 * EDITAR EL ENCARGO A MANO.
 *
 * El caso que lo trajo: Google contesta «los filtros de contenido bloquearon
 * esta imagen, cambia la descripción de la toma» y no había ninguna forma de
 * cambiarla. Un filtro no se discute — se cambia la palabra que lo dispara.
 *
 * El texto se lee del DOM al pulsar «Guardar», no según se escribe: repintar la
 * pantalla mientras se teclea en el móvil cierra el teclado y pierde el cursor.
 */
async function accionGuardarPrompt(activoId){

  if (!p || !activoId) return;

  var cajaNeg = $('editor-negativo');

    estado.editandoPrompt = null;

/** Cuántas veces seguidas ha fallado un activo, contando desde la última. */
function fallosSeguidos(a){
  var gens = (a && a.generations) || [];
  var n = 0;
  for (var i = gens.length - 1; i >= 0; i -= 1) {
    if (gens[i].status !== 'failed') break;
    n += 1;
  }
  return n;
}

async function accionGenerar(activoId){
  var p = estado.proyecto;
  if (!p) return;
  var a = activos(p).find(function(x){ return x.id === activoId; });
  if (!a) return;

  // NO SEGUIR PAGANDO EL MISMO FALLO. El usuario encadenó NUEVE intentos del
  // mismo clip, los nueve con el mismo error, porque el mensaje no le decía
  // nada con lo que decidir. Cada intento de vídeo se factura igual haya salido
  // o no, así que a partir del tercero se pregunta y se le recuerda el error.
  var seguidos = fallosSeguidos(a);
  if (seguidos >= 3) {
    var ultimo = (a.generations || []).filter(function(g){ return g.status === 'failed'; }).pop();
    if (!window.confirm(
      'Este elemento ha fallado ' + seguidos + ' veces seguidas, siempre por lo mismo:\n\n' +
      recorte((ultimo && ultimo.error) || 'sin motivo', 220) + '\n\n' +
      'Cada intento se paga aunque falle. Si no has cambiado nada, va a volver a fallar: ' +
      'prueba a editar el prompt.\n\n¿Intentarlo otra vez de todos modos?'
    )) return;
  }

  // Regenerar algo aprobado invalida todo lo que se apoyaba en ello. Se avisa
  // con el número exacto: es una decisión cara, no un clic más.
  if (a.locked) {
    var deps = dependientes(p, a.id).length;
    var texto = 'Este activo está aprobado y bloqueado.\n\nAl regenerarlo se desbloquea' +
      (deps ? ' y ' + deps + ' activos que dependen de él quedarán marcados como desactualizados' : '') + '.\n\n¿Continuar?';
    if (!window.confirm(texto)) return;
  }

  await ejecutar(async function(){
    if (a.locked) await api.desbloquear(p.id, a.id);
    await api.generar(p.id, a.id);
    estado.genVista = null;
    await cargarProyecto(p.id);
    latir(true);
  });
}

async function accionAprobar(activoId, genId){

  await ejecutar(async function(){

    estado.activoSel = sit.siguiente ? sit.siguiente.id : null;

  if (estado.cola) colaTic();

/**
 * Borra un proyecto entero, con todo su material.
 *
 * Se pregunta antes y hay que escribir nada: basta con confirmar. No hay

  if (!confirm('¿Borrar «' + nombre + '» y todo su material?\n\nSe van las imágenes, los clips, la música y el montaje. No se puede deshacer.')) return;

function accionContinuar(id){

async function comprobarSalud(destino){
  try {
    var s = await api.salud();
    estado.salud = s;
  } catch (e) {
    estado.salud = { __error: (e && e.message) || 'No se pudo consultar /api/salud.' };
  }
  if (destino === 'acceso') {
    var caja = $('acceso-salud');
    caja.classList.remove('oculto');
    caja.innerHTML = htmlSalud(estado.salud);
  } else {
    pintarEn('caja-salud', htmlSalud(estado.salud));
  }
}

// Delegación de eventos
// ───────────────────────────────────────────────────────────────────────

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-accion]');
  if (!el) return;
  var accion = el.getAttribute('data-accion');

  if (accion === 'entrar') { entrar(); return; }
  if (accion === 'salud-acceso') { comprobarSalud('acceso'); return; }
  if (accion === 'salud') { comprobarSalud('perfil'); return; }
  if (accion === 'salir') { cerrarSesion(''); return; }

  if (accion === 'ir') { irA(el.getAttribute('data-ruta')); return; }
  if (accion === 'refrescar') {
    if (estado.proyectoId) cargarProyecto(estado.proyectoId).then(function(){ pintar(); });
    else cargarResumenes().then(pintar);
    return;
  }

  if (accion === 'subtab') { estado.subtab = el.getAttribute('data-tab'); pintar(); window.scrollTo(0,0); return; }
  if (accion === 'continuar') { accionContinuar(el.getAttribute('data-id')); return; }

  if (accion === 'abrir-activo') {
    var id = el.getAttribute('data-activo');
    // Desde el panel, un activo pertenece a un proyecto que quizá no está
    // abierto: primero se navega y luego se selecciona.
    if (estado.vista !== 'proyecto' && estado.proyecto) {
      estado.activoSel = id; estado.genVista = null; estado.editandoPrompt = null; estado.subtab = 'produccion';
      irA('#/proyecto/' + estado.proyecto.id);
      return;
    }
    estado.activoSel = id;
    estado.genVista = null;
    estado.editandoPrompt = null;
    estado.subtab = 'produccion';
    pintar();
    var caja = $('caja-revision');
    if (caja) caja.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }

  if (accion === 'ver-gen') { estado.genVista = el.getAttribute('data-gen'); pintar(); return; }
  if (accion === 'actualizar-plan') { accionActualizarPlan(el.getAttribute('data-id')); return; }
  if (accion === 'guardar-telefono') { accionGuardarEnElTelefono(el); return; }
  if (accion === 'copiar-enlace') {
    var u = el.getAttribute('data-url') || '';
    copiarAlPortapapeles(u).then(function(ok){
      avisar(ok ? 'Enlace copiado. Pégalo en Safari para descargarlo.' : 'No se pudo copiar el enlace.', ok ? 'ok' : '');
    });
    return;
  }
  if (accion === 'editar-prompt') { estado.editandoPrompt = el.getAttribute('data-activo'); pintar(); return; }
  if (accion === 'cancelar-prompt') { estado.editandoPrompt = null; pintar(); return; }
  if (accion === 'guardar-prompt') { accionGuardarPrompt(el.getAttribute('data-activo')); return; }
  if (accion === 'restaurar-prompt') { accionRestaurarPrompt(el.getAttribute('data-activo')); return; }
  if (accion === 'cola-etapa') { arrancarCola(el.getAttribute('data-etapa')); return; }
  if (accion === 'cola-parar') { pararCola('Cola detenida. Lo generado se queda; nada se pierde.'); return; }
  if (accion === 'generar') { accionGenerar(el.getAttribute('data-activo')); return; }
  if (accion === 'aprobar') { accionAprobar(el.getAttribute('data-activo'), el.getAttribute('data-gen')); return; }
  if (accion === 'rechazar') { accionRechazar(el.getAttribute('data-activo'), el.getAttribute('data-gen')); return; }
  if (accion === 'montar') { accionMontar(); return; }
  if (accion === 'entregar') { accionEntregar(); return; }
  if (accion === 'borrar-proyecto') { accionBorrar(el.getAttribute('data-id')); return; }
  if (accion === 'filtro-bib') { estado.filtroBib = el.getAttribute('data-f'); pintar(); return; }

  // ── Formulario de creación: se actualiza por trozos para no perder el foco ──
  if (accion === 'instr') {
    var iid = el.getAttribute('data-id');
    var pos = estado.form.instrumentos.indexOf(iid);
    if (pos === -1) {
      if (estado.form.instrumentos.length >= 8) { avisar('Ocho instrumentos es el máximo razonable para un corto.'); return; }
      estado.form.instrumentos.push(iid);
    } else estado.form.instrumentos.splice(pos, 1);
    pintarEn('chips-elegidos', htmlChipsElegidos());
    pintarEn('lista-instr', htmlInstrumentos());
    return;
  }
  if (accion === 'categoria') {
    estado.form.categoria = el.getAttribute('data-id');
    pintar();
    return;
  }
  if (accion === 'tipo') { estado.form.tipo = el.getAttribute('data-id'); pintarEn('tipos-interprete', htmlTipos()); return; }
  // Sólo se repinta la lista tocada: el formulario entero se lleva por delante
  // el foco de la dirección creativa, y con él el teclado a media palabra.
  if (accion === 'modelo-imagen') {
    estado.form.modeloImagen = el.getAttribute('data-id');
    pintarEn('lista-modelo-imagen', htmlModelosImagen());
    return;
  }
  if (accion === 'modelo-video') {
    estado.form.modeloVideo = el.getAttribute('data-id');
    pintarEn('lista-modelo-video', htmlModelosVideo());
    return;
  }
  if (accion === 'duracion') { estado.form.duracion = Number(el.getAttribute('data-seg')); pintar(); return; }
  if (accion === 'formato') { estado.form.formato = el.getAttribute('data-id'); pintar(); return; }
  if (accion === 'ficha-abrir') { estado.form.fichaAbierta = Number(el.getAttribute('data-n')); pintar(); return; }
  if (accion === 'ficha-rasgo') {
    var ficha = fichaEn(estado.form.fichaAbierta);
    var rasgo = el.getAttribute('data-rasgo'), valor = el.getAttribute('data-valor');
    // Volver a tocar el botón que ya estaba puesto lo quita: es la única forma
    // de devolverle la decisión al director desde el móvil sin un botón extra.
    ficha[rasgo] = (ficha[rasgo] === valor) ? '' : valor;
    pintar();
    return;
  }
  if (accion === 'ficha-limpiar') {
    fichaEn(estado.form.fichaAbierta)[el.getAttribute('data-rasgo')] = '';
    pintar();
    return;
  }
  if (accion === 'ficha-copiar') {
    var origen = estado.form.fichas[estado.form.fichaAbierta - 1] || {};
    for (var i = 1; i <= cuantosInterpretes(); i += 1) {
      if (i === estado.form.fichaAbierta) continue;
      var copia = {};
      for (var k in origen) if (origen[k]) copia[k] = origen[k];
      estado.form.fichas[i - 1] = copia;
    }
    pintar();
    avisar('Ficha copiada a los ' + (cuantosInterpretes() - 1) + ' intérpretes restantes.');
    return;
  }
  if (accion === 'crear-proyecto') { crearProyecto(); return; }
});

  if (!campo || !estado.form) return;
  estado.form[campo] = el.value;
  // Sólo la búsqueda repinta, y sólo su lista: los textos largos se escriben
  // sin que nada se mueva debajo del dedo.
  if (campo === 'busqueda') pintarEn('lista-instr', htmlInstrumentos());
});

// El texto libre de las fichas se guarda sin repintar: en el móvil, repintar
// mientras se escribe cierra el teclado y pierde el cursor.
document.addEventListener('input', function(ev){
  var el = ev.target;

  if (!rasgo || !estado.form) return;
  fichaEn(estado.form.fichaAbierta)[rasgo] = el.value;
});

document.addEventListener('change', function(ev){

  var campo = el.getAttribute && el.getAttribute('data-campo');
  if (!campo || !estado.form) return;
  estado.form[campo] = el.value;

  if (campo === 'tipo') { limpiarFichasDeOtroGenero(); pintar(); }
  if (campo === 'escenario' || campo === 'estilo' || campo === 'generoMusical') pintar();
});

// Cambiar el modelo de un corto ya empezado. Va por su propio atributo y no por
// `data-campo` porque no es un borrador de formulario: se guarda en el acto.
document.addEventListener('change', function(ev){
  var el = ev.target;
  var cual = el.getAttribute && el.getAttribute('data-modelo');
  if (!cual) return;
  var id = el.getAttribute('data-id');
  var cuerpo = cual === 'imagen' ? { imageModelId: el.value } : { videoModelId: el.value };
  ejecutar(async function(){
    await api.cambiarModelo(id, cuerpo);
    await cargarProyecto(id);
    avisar('Modelo cambiado. Lo que generes a partir de ahora lo usará.', 'ok');
  });
