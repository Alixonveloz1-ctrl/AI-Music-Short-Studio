<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Music Short Studio</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   AI Music Short Studio — hoja de estilo única.

   Primero el móvil. Todo el diseño está pensado para un pulgar: ningún
   objetivo táctil baja de 44 px y las decisiones importantes (aprobar y
   regenerar) viven en botones grandes, no en enlaces pequeños.
   El escritorio se consigue con dos consultas de medios al final.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --fondo:      #070a1a;
  --fondo2:     #0a0f26;
  --tarjeta:    #111834;
  --tarjeta2:   #182146;
  --borde:      rgba(146,124,255,.16);
  --borde2:     rgba(146,124,255,.30);
  --acento:     #7c5cff;
  --acento2:    #b06cff;
  --acento-tap: rgba(124,92,255,.16);
  --texto:      #eceafe;
  --tenue:      #8d92c4;
  --tenue2:     #656a99;
  --ok:         #35d39a;
  --aviso:      #ffb454;
  --error:      #ff6b7f;
  --r:          20px;
  --r-sm:       13px;
  --alto-barra: 66px;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{
  background:var(--fondo);
  color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* Halo violeta de fondo. Fijo y sin eventos: decora sin estorbar al scroll. */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 45% at 15% 0%, rgba(124,92,255,.16) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 12%, rgba(176,108,255,.10) 0%, transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(80,60,180,.10) 0%, transparent 70%);
}

.oculto{ display:none !important; }

/* ── Tipografía y piezas sueltas ─────────────────────────────────────── */
h1{ font-size:22px; font-weight:700; letter-spacing:-.02em; }
h2{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
h3{ font-size:15px; font-weight:700; }
h4{ font-size:13px; font-weight:700; color:var(--tenue); text-transform:uppercase; letter-spacing:.08em; }
a{ color:var(--acento2); text-decoration:none; }
code,pre{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }

.tenue{ color:var(--tenue); }
.mini{ font-size:12.5px; }
.centro{ text-align:center; }
.sube{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--acento2); font-weight:700; }

/* ── Estructura ──────────────────────────────────────────────────────── */
.app{ position:relative; z-index:1; max-width:1500px; margin:0 auto; }
#vista{ padding:14px 14px calc(var(--alto-barra) + env(safe-area-inset-bottom) + 26px); }

.cab{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background:linear-gradient(180deg, rgba(7,10,26,.97) 60%, rgba(7,10,26,0));
  backdrop-filter:blur(12px);
}
.cab-tit{ flex:1; min-width:0; }
.cab-tit h1{ font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cab-tit p{ font-size:12px; color:var(--tenue); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.marca{
  background:linear-gradient(120deg,#a78bfa,#e879f9,#818cf8);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}

/* ── Tarjetas ────────────────────────────────────────────────────────── */
.tarjeta{
  background:linear-gradient(160deg, var(--tarjeta) 0%, var(--fondo2) 100%);
  border:1px solid var(--borde);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:14px;
}
.tarjeta > h2, .tarjeta > h3{ margin-bottom:10px; }
.tarjeta.plana{ background:var(--tarjeta); }

.hero{
  position:relative; overflow:hidden;
  background:linear-gradient(150deg, #221a52 0%, #141a3e 55%, #101534 100%);
  border:1px solid var(--borde2);
}
.hero::after{
  content:''; position:absolute; right:-60px; top:-70px; width:220px; height:220px;
  background:radial-gradient(circle, rgba(176,108,255,.32), transparent 65%);
  pointer-events:none;
}
.hero-fila{ display:flex; align-items:center; gap:16px; }
.hero-txt{ flex:1; min-width:0; }
.hero-txt h2{ margin-bottom:4px; }

/* ── Anillo de progreso ──────────────────────────────────────────────── */
.anillo{ position:relative; width:104px; height:104px; flex:0 0 104px; }
.anillo svg{ width:100%; height:100%; transform:rotate(-90deg); }
.anillo circle{ fill:none; stroke-width:9; stroke-linecap:round; }
.anillo .pista{ stroke:rgba(255,255,255,.07); }
.anillo .valor{ stroke:url(#degAnillo); transition:stroke-dashoffset .6s ease; }
.anillo b{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-size:23px; font-weight:700; letter-spacing:-.03em;
}
.anillo b span{ font-size:9.5px; font-weight:600; color:var(--tenue); letter-spacing:.1em; text-transform:uppercase; }

/* ── Fichas (chips) ──────────────────────────────────────────────────── */
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 12px; min-height:38px;
  background:var(--tarjeta2); border:1px solid var(--borde);
  border-radius:999px; color:var(--texto); font-size:13px; font-weight:600;
  cursor:pointer; font-family:inherit;
}
.chip .cuenta{ font-size:11.5px; color:var(--tenue); font-variant-numeric:tabular-nums; }
.chip.on{ background:var(--acento-tap); border-color:var(--acento); color:#fff; }
.chip.completa{ border-color:rgba(53,211,154,.45); }
.chip.completa .cuenta{ color:var(--ok); }
.chip.activa{ border-color:var(--acento); box-shadow:0 0 0 1px rgba(124,92,255,.35) inset; }
.chip.activa .cuenta{ color:var(--acento2); }
.chip.espera{ opacity:.5; }
.chip.quitar::after{ content:'×'; font-size:17px; color:var(--tenue); margin-left:2px; }

/* ── Botones ─────────────────────────────────────────────────────────── */
button{ font-family:inherit; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:12px 18px;
  border-radius:14px; border:1px solid var(--borde);
  background:var(--tarjeta2); color:var(--texto);
  font-size:15px; font-weight:700; cursor:pointer;
}
.btn:disabled{ opacity:.38; cursor:not-allowed; }
.btn.pri{
  background:linear-gradient(120deg,var(--acento),var(--acento2));
  border-color:transparent; color:#fff;
  box-shadow:0 8px 22px -10px rgba(124,92,255,.9);
}
.btn.ok{ background:linear-gradient(120deg,#1f9e73,#35d39a); border-color:transparent; color:#04231a; }
.btn.fantasma{ background:transparent; }
.btn.peligro{ color:var(--error); border-color:rgba(255,107,127,.35); background:transparent; }
.btn.ancho{ width:100%; }
.btn.grande{ min-height:56px; font-size:16px; border-radius:17px; }
.btn.pequeno{ min-height:40px; padding:8px 14px; font-size:13.5px; border-radius:11px; }
.acciones{ display:flex; flex-wrap:wrap; gap:9px; margin-top:12px; }
.acciones .btn{ flex:1 1 130px; }

/* ── Formularios ─────────────────────────────────────────────────────── */
label.campo{ display:block; margin-bottom:12px; }
label.campo > span{ display:block; font-size:12.5px; font-weight:700; color:var(--tenue); margin-bottom:6px; }
input[type=text],input[type=search],input[type=password],textarea,select{
  width:100%; padding:13px 14px; min-height:48px;
  background:var(--fondo2); color:var(--texto);
  border:1px solid var(--borde); border-radius:13px;
  font-size:16px; /* 16px evita que iOS haga zoom al enfocar */
  font-family:inherit; line-height:1.45;
}
textarea{ resize:vertical; min-height:88px; }
select{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--tenue) 50%),linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px; background-size:6px 6px,6px 6px; background-repeat:no-repeat; padding-right:40px; }
input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--acento); box-shadow:0 0 0 3px rgba(124,92,255,.16); }
.rejilla2{ display:grid; grid-template-columns:1fr; gap:10px; }
.paso{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; margin-right:8px; border-radius:8px;
  background:var(--acento-tap); color:var(--acento2); font-size:12.5px; font-weight:800;
}

/* ── Listas de selección ─────────────────────────────────────────────── */
.opciones{ display:flex; flex-direction:column; gap:7px; max-height:330px; overflow-y:auto; margin-top:10px; padding-right:2px; }
.opcion{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:left; padding:12px 14px; min-height:50px;
  background:var(--fondo2); border:1px solid var(--borde); border-radius:var(--r-sm);
  color:var(--texto); font-size:14.5px; cursor:pointer;
}
.opcion small{ color:var(--tenue); font-size:12px; }
.opcion.on{ border-color:var(--acento); background:var(--acento-tap); }

/* ── Filas de producción ─────────────────────────────────────────────── */
.filas{ display:flex; flex-direction:column; gap:8px; }
.fila{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:12px 13px; min-height:56px;
  background:var(--fondo2); border:1px solid var(--borde);
  border-left:3px solid var(--tenue2);
  border-radius:var(--r-sm); color:var(--texto); cursor:pointer;
}
.fila:disabled{ cursor:default; }
.fila .nom{ flex:1; min-width:0; font-size:14px; font-weight:600; }
.fila .nom small{ display:block; font-weight:400; font-size:11.5px; color:var(--tenue); }
.fila.sel{ background:var(--acento-tap); border-color:var(--acento); }
.fila.pending{ border-left-color:var(--tenue2); }
.fila.generating{ border-left-color:var(--acento2); }
.fila.review{ border-left-color:var(--aviso); }
.fila.approved{ border-left-color:var(--ok); }
.fila.caduco{ border-left-color:var(--error); }

.etiq{
  display:inline-block; padding:4px 9px; border-radius:999px;
  font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--borde); color:var(--tenue); white-space:nowrap;
}
.etiq.pending{ color:var(--tenue); }
.etiq.generating{ color:var(--acento2); border-color:rgba(176,108,255,.4); background:rgba(176,108,255,.10); }
.etiq.review{ color:var(--aviso); border-color:rgba(255,180,84,.45); background:rgba(255,180,84,.10); }
.etiq.approved{ color:var(--ok); border-color:rgba(53,211,154,.42); background:rgba(53,211,154,.10); }
.etiq.caduco{ color:var(--error); border-color:rgba(255,107,127,.42); background:rgba(255,107,127,.10); }
.etiq.bloq{ color:#dcd3ff; border-color:var(--borde2); background:rgba(124,92,255,.12); }

/* ── Avisos ──────────────────────────────────────────────────────────── */
.nota{
  padding:12px 14px; border-radius:var(--r-sm); font-size:13.5px;
  background:rgba(124,92,255,.09); border:1px solid var(--borde); color:#d9d5ff;
  margin-bottom:11px;
}
.nota.aviso{ background:rgba(255,180,84,.09); border-color:rgba(255,180,84,.35); color:#ffdfae; }
.nota.mala{ background:rgba(255,107,127,.09); border-color:rgba(255,107,127,.35); color:#ffc5cd; }
.nota.buena{ background:rgba(53,211,154,.09); border-color:rgba(53,211,154,.32); color:#b6f2da; }
.nota b{ color:#fff; }

/* ── Medios ──────────────────────────────────────────────────────────── */
.medio{
  background:#05070f; border:1px solid var(--borde); border-radius:var(--r-sm);
  overflow:hidden; margin-bottom:11px;
}
.medio img,.medio video{ display:block; width:100%; max-height:62vh; object-fit:contain; background:#05070f; }
.medio audio{ display:block; width:100%; padding:14px; }
.medio-vacio{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  min-height:190px; padding:26px 18px; text-align:center; color:var(--tenue); font-size:13.5px;
}

.girando{
  width:30px; height:30px; border-radius:50%;
  border:3px solid rgba(255,255,255,.12); border-top-color:var(--acento2);
  animation:girar .9s linear infinite;
}
@keyframes girar{ to{ transform:rotate(360deg); } }
.punto{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--acento2); animation:latir 1.4s ease-in-out infinite; }
@keyframes latir{ 0%,100%{ opacity:.35; transform:scale(.8) } 50%{ opacity:1; transform:scale(1.15) } }

/* ── Detalles plegables ──────────────────────────────────────────────── */
details{ border:1px solid var(--borde); border-radius:var(--r-sm); background:var(--fondo2); margin-bottom:11px; }
summary{ padding:13px 14px; min-height:48px; display:flex; align-items:center; font-size:13.5px; font-weight:700; color:var(--tenue); cursor:pointer; list-style:none; }
summary::-webkit-details-marker{ display:none; }
summary::after{ content:'▾'; margin-left:auto; color:var(--tenue2); }
details[open] summary::after{ content:'▴'; }
details .cuerpo{ padding:0 14px 14px; }
details pre{ white-space:pre-wrap; word-break:break-word; background:#05070f; border:1px solid var(--borde); border-radius:11px; padding:12px; color:#cfd0ee; margin-bottom:10px; }

/* ── Tablas y listas de datos ────────────────────────────────────────── */
.desliza{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px; }
table{ border-collapse:collapse; width:100%; font-size:12.5px; min-width:560px; }
th,td{ text-align:left; padding:8px 9px; border-bottom:1px solid var(--borde); vertical-align:top; }
th{ color:var(--tenue); font-size:11px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }

.datos div{ display:flex; gap:10px; padding:7px 0; border-bottom:1px solid rgba(146,124,255,.08); font-size:13.5px; }
.datos dt{ flex:0 0 40%; max-width:150px; color:var(--tenue); font-size:12.5px; }
.datos dd{ flex:1; min-width:0; }

.tiempos{ display:flex; flex-direction:column; gap:5px; }
.tiempos li{ display:flex; align-items:center; gap:9px; padding:8px 11px; background:var(--fondo2); border:1px solid var(--borde); border-radius:10px; font-size:12.5px; list-style:none; }
.tiempos .tc{ font-variant-numeric:tabular-nums; color:var(--acento2); font-weight:700; }
.tiempos .cl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tiempos li.rep{ border-style:dashed; }

.reglas li{ margin-left:18px; font-size:13px; color:#cfd0ee; padding:3px 0; }

.eventos{ display:flex; flex-direction:column; gap:6px; }
.eventos li{ display:flex; gap:9px; font-size:12.5px; color:#c9cbee; list-style:none; padding:5px 0; border-bottom:1px solid rgba(146,124,255,.07); }
.eventos time{ color:var(--tenue2); font-variant-numeric:tabular-nums; flex:0 0 auto; }

/* ── Galería de la biblioteca ────────────────────────────────────────── */
.galeria{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; }
.galeria figure{ background:var(--fondo2); border:1px solid var(--borde); border-radius:var(--r-sm); overflow:hidden; }
.galeria img,.galeria video{ width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#05070f; }
.galeria audio{ width:100%; padding:8px; }
.galeria figcaption{ padding:8px 10px; font-size:11.5px; color:var(--tenue); }

/* ── Pestañas internas del proyecto ──────────────────────────────────── */
.subtabs{ display:flex; gap:6px; background:var(--fondo2); border:1px solid var(--borde); border-radius:15px; padding:5px; margin-bottom:14px; }
.subtabs button{ flex:1; min-height:44px; border:none; border-radius:11px; background:transparent; color:var(--tenue); font-size:13.5px; font-weight:700; cursor:pointer; }
.subtabs button.on{ background:var(--acento-tap); color:#fff; box-shadow:0 0 0 1px var(--borde2) inset; }

/* ── Barra inferior fija ─────────────────────────────────────────────── */
.barra{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; align-items:flex-end; justify-content:space-around;
  height:calc(var(--alto-barra) + env(safe-area-inset-bottom));
  padding:0 6px env(safe-area-inset-bottom);
  background:rgba(10,14,34,.94); backdrop-filter:blur(16px);
  border-top:1px solid var(--borde);
}
.barra button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--alto-barra); border:none; background:transparent;
  color:var(--tenue2); font-size:10.5px; font-weight:700; cursor:pointer;
}
.barra button .ic{ font-size:19px; line-height:1; }
.barra button.on{ color:var(--acento2); }
.barra .crear{ flex:0 0 68px; }
.barra .crear .ic{
  display:flex; align-items:center; justify-content:center;
  width:52px; height:52px; margin-bottom:2px; border-radius:18px; font-size:27px; color:#fff;
  background:linear-gradient(135deg,var(--acento),var(--acento2));
  box-shadow:0 10px 24px -10px rgba(124,92,255,1);
}

/* ── Acceso ──────────────────────────────────────────────────────────── */
.acceso{ position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); }
.acceso .caja{ width:100%; max-width:390px; }
.acceso .logo{ text-align:center; margin-bottom:22px; }
.acceso .logo .ic{ font-size:44px; }
.acceso .logo h1{ font-size:26px; margin-top:6px; }
.acceso .logo p{ color:var(--tenue); font-size:13px; margin-top:4px; }

/* ── Mensajes flotantes ──────────────────────────────────────────────── */
#avisos{
  position:fixed; z-index:60; left:12px; right:12px;
  bottom:calc(var(--alto-barra) + env(safe-area-inset-bottom) + 12px);
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
#avisos div{
  pointer-events:auto; padding:13px 15px; border-radius:14px; font-size:13.5px; font-weight:600;
  background:#1d1140; border:1px solid rgba(255,107,127,.45); color:#ffd3d9;
  box-shadow:0 14px 34px -14px #000;
  animation:entra .22s ease;
}
#avisos div.ok{ border-color:rgba(53,211,154,.45); color:#c2f5e2; }
@keyframes entra{ from{ opacity:0; transform:translateY(10px) } }

/* ══ Escritorio: tres columnas ═════════════════════════════════════════ */
@media (min-width:900px){
  #vista{ padding:18px 24px 40px; }
  .barra{ position:sticky; top:0; bottom:auto; height:auto; border-top:none; border-bottom:1px solid var(--borde); justify-content:center; gap:6px; padding:8px; }
  .barra button{ flex:0 0 auto; flex-direction:row; gap:8px; height:46px; padding:0 16px; border-radius:13px; font-size:13.5px; }
  .barra button.on{ background:var(--acento-tap); }
  .barra .crear{ flex:0 0 auto; }
  .barra .crear .ic{ width:30px; height:30px; font-size:19px; border-radius:11px; margin:0; }
  .app{ display:flex; flex-direction:column-reverse; }
  .rejilla2{ grid-template-columns:1fr 1fr; gap:14px; }

  /* La sala de producción se despliega entera: configuración a la
     izquierda, producción en el centro, previsualización a la derecha.
     Las pestañas sólo existen para el móvil, así que aquí desaparecen. */
  .subtabs{ display:none; }
  .sala{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr); gap:16px; align-items:start; }
  .col{ display:block !important; min-width:0; }
  .col-a{ order:1; } .col-b{ order:2; } .col-c{ order:3; }
  .galeria{ grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .anillo{ width:120px; height:120px; flex-basis:120px; }
}
@media (max-width:899px){
  .col{ display:none; }
  .col.on{ display:block; }
}
</style>
</head>
<body>

<!-- Degradado del anillo de progreso. Vive en un SVG oculto porque un
     gradiente sólo se puede referenciar desde el mismo documento. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="degAnillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
</svg>

<div id="acceso" class="acceso oculto">
  <div class="caja">
    <div class="logo">
      <div class="ic">🎬</div>
      <h1 class="marca">AI Music Short Studio</h1>
      <p>Cortometrajes musicales instrumentales</p>
    </div>
    <div class="tarjeta">
      <label class="campo">
        <span>Contraseña de la aplicación</span>
        <input type="password" id="clave" autocomplete="current-password" placeholder="Tu clave privada">
      </label>
      <button class="btn pri ancho grande" data-accion="entrar">Entrar</button>
      <div id="acceso-error" class="nota mala oculto" style="margin-top:12px"></div>
      <p class="mini tenue" style="margin-top:14px">
        La clave se guarda sólo en este teléfono y viaja en la cabecera
        <code>x-app-key</code>. Protege tus créditos: sin ella el servidor no
        genera nada.
      </p>
      <button class="btn fantasma ancho pequeno" style="margin-top:10px" data-accion="salud-acceso">Comprobar el estado del servidor</button>
      <div id="acceso-salud" class="oculto" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="app" class="app oculto">
  <main id="vista"></main>
  <nav class="barra" id="barra"></nav>
</div>

<div id="avisos"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════
   AI Music Short Studio — interfaz completa en un solo archivo.

   La regla del producto manda sobre todo lo demás: la IA propone y genera,
   pero NADA queda aprobado sin que el usuario pulse «Aprobar». Por eso el
   estado «en revisión» se pinta en ámbar y con contadores por todas partes:
   es la única cosa que la herramienta necesita que el usuario vea.

   No hay compilación ni dependencias. Las vistas se dibujan con cadenas de
   HTML y los clics se recogen con un único delegador sobre `document`, que
   es lo que menos código y menos sorpresas da cuando todo vive junto.
   ═══════════════════════════════════════════════════════════════════════ */

// ───────────────────────────────────────────────────────────────────────
// Utilidades
// ───────────────────────────────────────────────────────────────────────

function $(id){ return document.getElementById(id); }

/** Escapa texto para meterlo en HTML. TODO lo que venga del servidor pasa por aquí. */
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/** Sin acentos y en minúsculas: así «violin» encuentra «Violín». */
function normalizar(v){
  // El rango se escribe con escapes: los signos diacríticos sueltos son
  // invisibles en un editor y se pierden al copiar el archivo.
  return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function fmtTiempo(seg){
  var t = Math.max(0, Math.round(Number(seg) || 0));
  var m = String(Math.floor(t / 60)).padStart(2,'0');
  var s = String(t % 60).padStart(2,'0');
  return m + ':' + s;
}

function fmtFecha(iso){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function fmtHora(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function fmtBytes(n){
  var b = Number(n) || 0;
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
  if (b >= 1024) return Math.round(b / 1024) + ' KB';
  return b + ' B';
}

/**
 * Sustituye el contenido de un contenedor SIN pisar lo que el usuario está
 * escribiendo. El repintado automático llega cada pocos segundos mientras se
 * consulta el estado de una generación; sin esta guarda, escribir la
 * descripción del vídeo era imposible porque el texto desaparecía a media
 * frase.
 */
function pintarEn(id, html){
  var caja = $(id);
  if (!caja) return;
  var foco = document.activeElement;
  if (foco && caja.contains(foco) && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
  caja.innerHTML = html;
}

/** Mensaje flotante. `tipo` puede ser 'ok'; cualquier otra cosa se pinta como error. */
function avisar(texto, tipo){
  var caja = $('avisos');
  var el = document.createElement('div');
  if (tipo === 'ok') el.className = 'ok';
  el.textContent = texto;
  caja.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, tipo === 'ok' ? 3200 : 7000);
}

/** Un error de verdad dice QUÉ ha fallado; nunca «error». */
function avisarError(e){
  var msg = (e && e.message) ? e.message : String(e || 'Fallo desconocido');
  if (e && e.configError) msg += ' — esto se arregla en las variables de entorno de Vercel, no reintentando.';
  if (e && e.detalle) msg += ' (' + e.detalle + ')';
  avisar(msg);
  console.error('[ams]', e);
}

// ───────────────────────────────────────────────────────────────────────
// Estado de la aplicación
// ───────────────────────────────────────────────────────────────────────

var CLAVE_ALMACEN = 'ams_clave';

var estado = {
  clave: '',
  vista: 'panel',          // panel | proyectos | crear | biblioteca | perfil | proyecto
  subtab: 'produccion',    // pestañas internas del proyecto (sólo móvil)
  resumenes: null,         // lista de /api/proyectos
  proyecto: null,          // proyecto completo abierto
  proyectoId: null,
  faltanParaMontar: null,  // lo que diga el servidor, si lo dice
  catalogo: null,
  activoSel: null,         // activo que se está revisando
  genVista: null,          // generación concreta que se está mirando
  trabajando: false,       // hay una acción del usuario en vuelo
  montajeJob: null,        // identificador del montaje en curso
  filtroBib: 'todo',
  form: null,              // borrador de la pantalla de configuración
  salud: null
};

// ───────────────────────────────────────────────────────────────────────
// Llamadas al servidor
// ───────────────────────────────────────────────────────────────────────

/**
 * Toda llamada lleva la cabecera x-app-key.
 *
 * Un 401 NO siempre significa «tu sesión caducó»: puede venir reenviado de
 * Google o de otro proveedor. Sólo se vuelve a pedir la contraseña cuando el
 * cuerpo trae code:'APP_AUTH', que es el que pone nuestra propia puerta; si no,
 * el error real quedaría tapado por la pantalla de acceso.
 */
async function pedir(ruta, opciones){
  var o = opciones || {};
  var cabeceras = { 'Content-Type': 'application/json' };
  if (estado.clave) cabeceras['x-app-key'] = estado.clave;

  var res;
  try {
    res = await fetch('/api/' + ruta, {
      method: o.metodo || 'GET',
      headers: cabeceras,
      body: o.cuerpo ? JSON.stringify(o.cuerpo) : undefined
    });
  } catch (e) {
    throw new Error('No hay conexión con el servidor. Comprueba la red y vuelve a intentarlo.');
  }

  var texto = await res.text();
  var datos = {};
  if (texto) {
    try { datos = JSON.parse(texto); }
    catch (e) { datos = null; }
  }

  if (!res.ok) {
    if (res.status === 401 && datos && datos.code === 'APP_AUTH') {
      cerrarSesion(datos.error || 'Tu sesión ha caducado. Vuelve a entrar con tu contraseña.');
      throw new Error(datos.error || 'No autorizado.');
    }
    // Vercel devuelve HTML cuando la función no existe. Decirlo con esas
    // palabras ahorra media hora de mirar la consola desde el móvil.
    if (!datos) {
      var falta = res.status === 404
        ? 'El endpoint /api/' + ruta.split('?')[0] + ' no existe en el servidor (404).'
        : 'El servidor respondió ' + res.status + ' sin datos legibles en /api/' + ruta.split('?')[0] + '.';
      throw new Error(falta);
    }
    var err = new Error(datos.error || ('El servidor respondió ' + res.status + ' en /api/' + ruta.split('?')[0] + '.'));
    err.status = res.status;
    err.configError = !!datos.configError;
    err.detalle = datos.detalle;
    throw err;
  }

  return datos || {};
}

/** Los endpoints los escribe otro agente: se acepta el nombre en los dos idiomas. */
function desenvolver(d, claves){
  if (!d) return null;
  for (var i = 0; i < claves.length; i++) {
    if (d[claves[i]] !== undefined && d[claves[i]] !== null) return d[claves[i]];
  }
  return d;
}

var api = {
  salud: function(){ return pedir('salud'); },
  catalogo: async function(){
    var d = await pedir('catalogo');
    return desenvolver(d, ['catalogo','catalog']);
  },
  proyectos: async function(){
    var d = await pedir('proyectos');
    var lista = desenvolver(d, ['proyectos','projects','items']);
    return Array.isArray(lista) ? lista : [];
  },
  crear: async function(config){
    // El endpoint puede esperar la configuración anidada en `config` o suelta
    // en la raíz. Se manda de las dos formas: duplicar unas claves no cuesta
    // nada y evita un 400 por un detalle de nombres.
    var cuerpo = Object.assign({ config: config, configuracion: config }, config);
    var d = await pedir('proyectos', { metodo:'POST', cuerpo: cuerpo });
    return d;
  },
  proyecto: function(id){ return pedir('proyecto?id=' + encodeURIComponent(id)); },
  generar: function(id, activo){ return pedir('generar', { metodo:'POST', cuerpo:{ id:id, activo:activo } }); },
  estadoGeneracion: function(id, activo, gen){
    return pedir('generar?id=' + encodeURIComponent(id) + '&activo=' + encodeURIComponent(activo) + '&gen=' + encodeURIComponent(gen));
  },
  aprobar: function(id, activo, gen){ return pedir('aprobar', { metodo:'POST', cuerpo:{ id:id, activo:activo, gen:gen } }); },
  rechazar: function(id, activo, gen){ return pedir('rechazar', { metodo:'POST', cuerpo:{ id:id, activo:activo, gen:gen } }); },
  desbloquear: function(id, activo){ return pedir('desbloquear', { metodo:'POST', cuerpo:{ id:id, activo:activo } }); },
  montar: function(id){ return pedir('montar', { metodo:'POST', cuerpo:{ id:id } }); },
  estadoMontaje: function(id, job){
    return pedir('montar?id=' + encodeURIComponent(id) + (job ? '&job=' + encodeURIComponent(job) : ''));
  },
  entrega: function(id, titulo, descripcion, hashtags){
    return pedir('entrega', { metodo:'POST', cuerpo:{ id:id, titulo:titulo, descripcion:descripcion, hashtags:hashtags } });
  }
};

// ───────────────────────────────────────────────────────────────────────
// Reglas de producción, calculadas aquí mismo
//
// El servidor manda su propio `status`, pero la interfaz necesita algo más
// que contadores: necesita poder decir EXACTAMENTE qué está bloqueando cada
// activo. Todo eso sale del proyecto, que ya viene entero, así que se calcula
// en el navegador (mismo criterio que api/_lib/progreso.js) y así la pantalla
// no depende de la forma concreta de la respuesta.
// ───────────────────────────────────────────────────────────────────────

var ETAPAS_ACTIVOS = ['images','videos','music','ambient'];
var ETAPAS = ['concept','images','videos','music','ambient','edit','delivery'];

var ETIQ_ETAPA = {
  concept: 'Concepto', images: 'Imágenes', videos: 'Vídeos',
  music: 'Música', ambient: 'Ambiente', edit: 'Montaje', delivery: 'Entrega'
};

var ETIQ_ESTADO = {
  pending: 'Pendiente', generating: 'Generando', review: 'En revisión', approved: 'Aprobado'
};

var ETIQ_MEDIO = { image:'Imagen', video:'Vídeo', audio:'Audio' };

var MEDIO_DE_TIPO = {
  master_character:'image', master_environment:'image', master_scene:'image',
  shot_image:'image', clip:'video', music:'audio', ambient:'audio'
};

var ETIQ_MONTAJE = {
  pending: 'sin montar', building: 'montando', review: 'previsualización en revisión',
  approved: 'montaje aprobado', exported: 'MP4 exportado', failed: 'el montaje falló'
};

var ETIQ_PULSO = { opening:'apertura', development:'desarrollo', climax:'clímax', closing:'cierre' };
var ETIQ_TRANSICION = { cut:'corte', dip_to_black:'fundido a negro', fade_in:'entra fundido', fade_out:'sale fundido' };

function activos(p){ return (p && Array.isArray(p.assets)) ? p.assets : []; }

function porOrden(p){
  return activos(p).slice().sort(function(a,b){ return (a.order||0) - (b.order||0); });
}

function estaAprobado(a){ return !!a.approvedGenerationId; }

/** Aprobado Y vigente: un activo desactualizado no cuenta como terminado. */
function cuenta(a){ return estaAprobado(a) && !a.stale; }

function activosDeEtapa(p, etapa){
  return porOrden(p).filter(function(a){ return a.stage === etapa; });
}

function etapaCompleta(p, etapa){
  var lista = activosDeEtapa(p, etapa);
  if (!lista.length) return true;
  return lista.every(cuenta);
}

function etapaAbierta(p, etapa){
  var i = ETAPAS_ACTIVOS.indexOf(etapa);
  if (i === -1) return false;
  for (var j = 0; j < i; j++) if (!etapaCompleta(p, ETAPAS_ACTIVOS[j])) return false;
  return true;
}

function dependenciasQueFaltan(p, a){
  var indice = {};
  activos(p).forEach(function(x){ indice[x.id] = x; });
  var faltan = [];
  (a.dependsOn || []).forEach(function(id){
    var dep = indice[id];
    if (dep && !cuenta(dep)) faltan.push(dep);
  });
  return faltan;
}

/** Activos que se construyen sobre este (directa o indirectamente). */
function dependientes(p, id){
  var salida = {}, cola = [id];
  while (cola.length) {
    var actual = cola.shift();
    activos(p).forEach(function(a){
      if ((a.dependsOn || []).indexOf(actual) === -1) return;
      if (salida[a.id]) return;
      salida[a.id] = a;
      cola.push(a.id);
    });
  }
  return Object.keys(salida).map(function(k){ return salida[k]; });
}

/** { ok } o { ok:false, motivo } — el motivo se enseña tal cual en pantalla. */
function puedeGenerar(p, a){
  if (!etapaAbierta(p, a.stage)) {
    return { ok:false, motivo: 'La etapa «' + ETIQ_ETAPA[a.stage] + '» todavía no está abierta: falta aprobar entera la etapa anterior.' };
  }
  var faltan = dependenciasQueFaltan(p, a);
  if (faltan.length) {
    return { ok:false, motivo: 'Faltan por aprobar: ' + faltan.map(function(x){ return x.label; }).join(', ') + '.' };
  }
  if (a.status === 'generating') return { ok:false, motivo:'Ya hay una generación en curso para este activo.' };
  if (a.locked) return { ok:false, motivo:'El activo está aprobado y bloqueado. Desbloquéalo para regenerarlo.' };
  return { ok:true };
}

/** Estado de producción completo: etapas con contadores, filas y siguiente acción. */
function situacion(p){
  var etapas = ETAPAS.map(function(etapa){
    var lista = activosDeEtapa(p, etapa);
    var aprobados = lista.filter(cuenta).length;
    var cortado = (p.finalCut && p.finalCut.status) || 'pending';
    var como;
    if (etapa === 'concept') como = 'complete';
    else if (etapa === 'edit') {
      como = (cortado === 'approved' || cortado === 'exported') ? 'complete'
           : ETAPAS_ACTIVOS.every(function(s){ return etapaCompleta(p, s); }) ? 'active' : 'pending';
    }
    else if (etapa === 'delivery') como = (cortado === 'exported') ? 'complete' : 'pending';
    else if (etapaCompleta(p, etapa)) como = 'complete';
    else if (etapaAbierta(p, etapa)) como = 'active';
    else como = 'pending';
    return { etapa: etapa, label: ETIQ_ETAPA[etapa], estado: como, aprobados: aprobados, total: lista.length };
  });

  var ordenados = porOrden(p);
  var enRevision = ordenados.filter(function(a){ return a.status === 'review'; });
  var generando = ordenados.filter(function(a){ return a.status === 'generating'; });

  // Lo que ya espera una decisión del usuario va SIEMPRE primero: es lo único
  // que sólo puede resolver él.
  var siguiente = enRevision[0] || null;
  if (!siguiente) {
    siguiente = ordenados.find(function(a){ return !cuenta(a) && puedeGenerar(p, a).ok; }) || null;
  }

  var totales = ordenados.length;
  var listos = ordenados.filter(cuenta).length;

  return {
    etapas: etapas,
    filas: ordenados,
    enRevision: enRevision,
    generando: generando,
    siguiente: siguiente,
    aprobados: listos,
    total: totales,
    porcentaje: totales ? Math.round((listos / totales) * 100) : 0,
    listoParaMontar: ETAPAS_ACTIVOS.every(function(s){ return etapaCompleta(p, s); })
  };
}

function generacionVista(a){
  if (!a || !a.generations || !a.generations.length) return null;
  if (estado.genVista) {
    var elegida = a.generations.find(function(g){ return g.id === estado.genVista; });
    if (elegida) return elegida;
  }
  var enCurso = a.generations.filter(function(g){ return g.status === 'generating'; }).pop();
  if (enCurso) return enCurso;
  var aprobada = a.generations.find(function(g){ return g.id === a.approvedGenerationId; });
  var ultima = a.generations[a.generations.length - 1];
  // Si la última ya está descartada pero hay una aprobada, se enseña la buena:
  // es la que representa al proyecto.
  if (ultima && ultima.status === 'rejected' && aprobada) return aprobada;
  return ultima || aprobada || null;
}

// ───────────────────────────────────────────────────────────────────────
// Sesión
// ───────────────────────────────────────────────────────────────────────

function cerrarSesion(mensaje){
  estado.clave = '';
  try { localStorage.removeItem(CLAVE_ALMACEN); } catch (e) {}
  $('app').classList.add('oculto');
  $('acceso').classList.remove('oculto');
  var caja = $('acceso-error');
  if (mensaje) { caja.textContent = mensaje; caja.classList.remove('oculto'); }
  else caja.classList.add('oculto');
}

async function entrar(){
  var campo = $('clave');
  var valor = (campo.value || '').trim();
  var caja = $('acceso-error');
  caja.classList.add('oculto');
  if (!valor) { caja.textContent = 'Escribe la contraseña.'; caja.classList.remove('oculto'); return; }

  estado.clave = valor;
  try {
    // Se valida contra un endpoint real y barato: si la clave está mal, el
    // servidor contesta APP_AUTH y no se guarda nada.
    estado.resumenes = await api.proyectos();
    try { localStorage.setItem(CLAVE_ALMACEN, valor); } catch (e) {}
    $('acceso').classList.add('oculto');
    $('app').classList.remove('oculto');
    campo.value = '';
    await arrancar();
  } catch (e) {
    estado.clave = '';
    caja.textContent = (e && e.message) || 'No se pudo entrar.';
    caja.classList.remove('oculto');
  }
}

// ───────────────────────────────────────────────────────────────────────
// Navegación
// ───────────────────────────────────────────────────────────────────────

function irA(ruta){
  if (location.hash === ruta) leerRuta();
  else location.hash = ruta;
}

function leerRuta(){
  var h = (location.hash || '').replace(/^#\/?/, '');
  var partes = h.split('/').filter(Boolean);
  var antes = estado.vista, antesId = estado.proyectoId;

  if (!partes.length) estado.vista = 'panel';
  else if (partes[0] === 'proyectos') estado.vista = 'proyectos';
  else if (partes[0] === 'crear') estado.vista = 'crear';
  else if (partes[0] === 'biblioteca') estado.vista = 'biblioteca';
  else if (partes[0] === 'perfil') estado.vista = 'perfil';
  else if (partes[0] === 'proyecto' && partes[1]) { estado.vista = 'proyecto'; estado.proyectoId = partes[1]; }
  else estado.vista = 'panel';

  // Cambiar de proyecto tira la selección: revisar el activo de otro corto no
  // tiene sentido y era una fuente de pantallas en blanco.
  if (estado.proyectoId !== antesId) { estado.activoSel = null; estado.genVista = null; }
  if (antes !== estado.vista) { window.scrollTo(0, 0); }

  pintar();
  cargarLoQueFalte();
}

// ───────────────────────────────────────────────────────────────────────
// Carga de datos
// ───────────────────────────────────────────────────────────────────────

async function cargarResumenes(){
  try { estado.resumenes = await api.proyectos(); }
  catch (e) { avisarError(e); estado.resumenes = estado.resumenes || []; }
}

async function cargarCatalogo(){
  if (estado.catalogo) return;
  try { estado.catalogo = await api.catalogo(); }
  catch (e) { avisarError(e); }
}

async function cargarProyecto(id, silencioso){
  try {
    var d = await api.proyecto(id);
    var p = desenvolver(d, ['project','proyecto']);
    if (!p || !p.id) throw new Error('El servidor no devolvió ningún proyecto para «' + id + '».');
    estado.proyecto = p;
    estado.proyectoId = p.id;
    var st = d.status || d.estado;
    estado.faltanParaMontar = (st && (st.missingForEdit || st.faltanParaMontar)) || null;
    if (p.finalCut) {
      // El identificador del montaje puede venir con varios nombres según cómo
      // lo guarde el servidor; cualquiera de ellos sirve para seguir el trabajo.
      estado.montajeJob = p.finalCut.job || p.finalCut.jobId || p.finalCut.buildId || estado.montajeJob;
    }
    return p;
  } catch (e) {
    if (!silencioso) avisarError(e);
    return null;
  }
}

/** Elige el proyecto que el panel debe enseñar: el último tocado y sin terminar. */
function proyectoEnCurso(){
  var lista = estado.resumenes || [];
  if (!lista.length) return null;
  var orden = lista.slice().sort(function(a,b){
    return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
  });
  return orden.find(function(p){ return p.finalCutStatus !== 'exported'; }) || orden[0];
}

var cargando = false;

async function cargarLoQueFalte(){
  if (cargando) return;
  cargando = true;
  try {
    if (estado.vista === 'crear') {
      await cargarCatalogo();
      if (!estado.form) prepararFormulario();
      pintar();
      return;
    }
    if (estado.vista === 'proyecto' && estado.proyectoId) {
      if (!estado.proyecto || estado.proyecto.id !== estado.proyectoId) {
        estado.proyecto = null;
        pintar();
        await cargarProyecto(estado.proyectoId);
        pintar();
      }
      return;
    }
    if (estado.vista === 'panel' || estado.vista === 'proyectos') {
      if (!estado.resumenes) { await cargarResumenes(); pintar(); }
      if (estado.vista === 'panel') {
        var res = proyectoEnCurso();
        if (res && (!estado.proyecto || estado.proyecto.id !== res.id)) {
          await cargarProyecto(res.id, true);
          pintar();
        }
      }
      return;
    }
  } finally {
    cargando = false;
  }
}

async function arrancar(){
  await cargarResumenes();
  leerRuta();
}

function htmlAnillo(pct){
  var r = 52, largo = 2 * Math.PI * r;
  var off = largo * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return '<div class="anillo">' +
    '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle class="pista" cx="60" cy="60" r="' + r + '"></circle>' +
      '<circle class="valor" cx="60" cy="60" r="' + r + '" stroke-dasharray="' + largo.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>' +
    '</svg>' +
    '<b>' + pct + '%<span>aprobado</span></b>' +
  '</div>';
}

function htmlChipsEtapas(sit){
  return '<div class="chips">' + sit.etapas.filter(function(e){
    return e.etapa !== 'concept' && e.etapa !== 'delivery';
  }).map(function(e){
    var clase = e.estado === 'complete' ? 'completa' : (e.estado === 'active' ? 'activa' : 'espera');
    var cuenta = e.total ? '<span class="cuenta">' + e.aprobados + '/' + e.total + '</span>'
                         : '<span class="cuenta">' + (e.estado === 'complete' ? 'hecho' : '—') + '</span>';
    return '<span class="chip ' + clase + '">' + esc(e.label) + cuenta + '</span>';
  }).join('') + '</div>';
}

function htmlEtiquetaActivo(a){
  if (a.stale) return '<span class="etiq caduco">Desactualizado</span>';
  return '<span class="etiq ' + esc(a.status) + '">' + esc(ETIQ_ESTADO[a.status] || a.status) + '</span>';
}

function htmlFilaActivo(a, seleccionado){
  var clases = ['fila', a.stale ? 'caduco' : a.status];
  if (seleccionado) clases.push('sel');
  var gens = (a.generations || []).length;
  return '<button class="' + clases.join(' ') + '" data-accion="abrir-activo" data-activo="' + esc(a.id) + '">' +
    '<span class="nom">' + esc(a.label) +
      '<small>' + esc(ETIQ_ETAPA[a.stage] || a.stage) + (gens ? ' · ' + gens + (gens === 1 ? ' generación' : ' generaciones') : '') +
      (a.locked ? ' · bloqueado' : '') + '</small>' +
    '</span>' + htmlEtiquetaActivo(a) +
  '</button>';
}

function htmlDatos(pares){
  var filas = pares.filter(function(p){ return p[1] !== undefined && p[1] !== null && p[1] !== ''; })
    .map(function(p){ return '<div><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>'; }).join('');
  return filas ? '<dl class="datos">' + filas + '</dl>' : '';
}

function htmlVacio(icono, titulo, texto, botonTexto, botonRuta){

    '<div style="font-size:40px">' + icono + '</div>' +

    (botonTexto ? '<button class="btn pri grande" style="margin-top:16px" data-accion="ir" data-ruta="' + esc(botonRuta) + '">' + esc(botonTexto) + '</button>' : '') +
  '</div>';
}

function htmlCargando(texto){
  return '<div class="tarjeta centro" style="padding:34px 20px">' +
    '<div class="girando" style="margin:0 auto 12px"></div>' +

/** Huella del proyecto tal y como está pintado ahora mismo en la pantalla. */
var huellaPintada = '';

/** ¿Hay un vídeo o un audio sonando dentro de la vista? */
function medioSonando(){
  var caja = $('vista');
  if (!caja || !caja.querySelectorAll) return false;
  var medios = caja.querySelectorAll('video, audio');
  for (var i = 0; i < medios.length; i++) if (!medios[i].paused && !medios[i].ended) return true;
  return false;
}

/**
 * Repinta la vista actual. Devuelve false si ha decidido NO tocar nada.
 *
 * `auto` marca los repintados que no ha pedido el usuario (los que dispara la
 * consulta periódica). Esos se saltan mientras hay un campo enfocado o un clip
 * reproduciéndose: perder media descripción escrita, o que el vídeo que estás
 * juzgando vuelva al segundo cero justo cuando ibas a aprobarlo, es peor que
 * enseñar un contador desfasado unos segundos. No se pierde nada: `huellaPintada`
 * sólo se actualiza cuando el repintado ocurre de verdad, así que el siguiente
 * latido lo vuelve a intentar.
 */
function pintar(auto){
  if (auto) {
    var foco = document.activeElement;
    if (foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return false;
    if (medioSonando()) return false;
  }
  pintarBarra();
  var v = $('vista');
  if (estado.vista === 'panel') v.innerHTML = vistaPanel();
  else if (estado.vista === 'proyectos') v.innerHTML = vistaProyectos();
  else if (estado.vista === 'crear') v.innerHTML = vistaCrear();
  else if (estado.vista === 'biblioteca') v.innerHTML = vistaBiblioteca();
  else if (estado.vista === 'perfil') v.innerHTML = vistaPerfil();
  else if (estado.vista === 'proyecto') v.innerHTML = vistaProyecto();
  huellaPintada = estado.proyecto ? huella(estado.proyecto) : '';
  return true;
}

function pintarBarra(){
  var v = estado.vista;
  var enProyecto = (v === 'proyecto');
  var items = [
    { id:'panel', ruta:'#/', ic:'◎', txt:'Panel', on:(v === 'panel') },
    { id:'proyectos', ruta:'#/proyectos', ic:'▤', txt:'Proyectos', on:(v === 'proyectos' || enProyecto) },
    { id:'crear', ruta:'#/crear', ic:'+', txt:'', on:(v === 'crear'), crear:true },
    { id:'biblioteca', ruta:'#/biblioteca', ic:'▣', txt:'Biblioteca', on:(v === 'biblioteca') },
    { id:'perfil', ruta:'#/perfil', ic:'☺', txt:'Perfil', on:(v === 'perfil') }
  ];
  $('barra').innerHTML = items.map(function(i){
    return '<button class="' + (i.crear ? 'crear ' : '') + (i.on ? 'on' : '') + '" data-accion="ir" data-ruta="' + i.ruta + '" ' +
      'aria-label="' + esc(i.txt || 'Crear un corto nuevo') + '">' +
      '<span class="ic">' + i.ic + '</span>' + (i.txt ? '<span>' + i.txt + '</span>' : '') +
    '</button>';
  }).join('');
}

function vistaPanel(){
  var cab = '<div class="cab"><div class="cab-tit">' +
    '<h1 class="marca">AI Music Short Studio</h1>' +
    '<p>Cortometrajes musicales instrumentales</p>' +
  '</div></div>';

  if (!estado.resumenes) return cab + htmlCargando('Cargando tus proyectos…');
  if (!estado.resumenes.length) {
    return cab + htmlVacio('🎬', 'Todavía no hay ningún corto',
      'Elige instrumento, escenario y estilo, y el equipo de producción preparará el plan. Tú apruebas cada pieza.',
      'Crear mi primer corto', '#/crear');
  }

  var res = proyectoEnCurso();
  var p = (estado.proyecto && res && estado.proyecto.id === res.id) ? estado.proyecto : null;

  if (!p) {
    return cab + '<div class="tarjeta hero"><div class="hero-fila">' +
      '<div class="hero-txt"><p class="sube">Proyecto en curso</p><h2>' + esc(res.title || 'Sin título') + '</h2>' +
      '<p class="tenue mini">Cargando el estado de producción…</p></div>' +
      '<div class="girando"></div></div></div>' + htmlListaProyectos();
  }

  var sit = situacion(p);
  var esperan = sit.enRevision.length;
  var enMarcha = sit.generando.length;

  var html = cab;

  html += '<div class="tarjeta hero">' +
    '<div class="hero-fila">' +
      '<div class="hero-txt">' +
        '<p class="sube">Proyecto en curso</p>' +
        '<h2>' + esc(p.delivery && p.delivery.title ? p.delivery.title : (p.plan && p.plan.concept ? p.plan.concept.title : 'Sin título')) + '</h2>' +
        '<p class="tenue mini">' + fmtTiempo(p.config.durationSec) + ' · ' +
          esc(sit.etapas.filter(function(e){ return e.estado === 'active'; }).map(function(e){ return e.label; })[0] || 'Todo aprobado') +
          ' · ' + sit.aprobados + '/' + sit.total + ' activos</p>' +
      '</div>' +
      htmlAnillo(sit.porcentaje) +
    '</div>' +
    '<div style="margin-top:14px">' + htmlChipsEtapas(sit) + '</div>' +
    (esperan
      ? '<div class="nota aviso" style="margin-top:14px"><b>' + esperan + (esperan === 1 ? ' elemento espera' : ' elementos esperan') + ' tu decisión.</b> Nada avanza hasta que lo apruebes o lo mandes regenerar.</div>'
      : (enMarcha
        ? '<div class="nota" style="margin-top:14px"><span class="punto"></span> ' + enMarcha + (enMarcha === 1 ? ' generación en curso' : ' generaciones en curso') + '. Puedes revisar otras cosas mientras tanto.</div>'
        : '')) +
    '<button class="btn pri ancho grande" style="margin-top:14px" data-accion="continuar" data-id="' + esc(p.id) + '">' +
      (sit.siguiente ? 'Continuar Producción' : (sit.listoParaMontar ? 'Ir al montaje final' : 'Abrir la sala de producción')) +
    '</button>' +
  '</div>';

  // Lista de producción: lo que espera decisión primero, luego lo que está en
  // marcha, luego lo que ya se puede generar.
  var pendientes = sit.enRevision
    .concat(sit.generando)
    .concat(sit.filas.filter(function(a){
      return a.status === 'pending' && puedeGenerar(p, a).ok;
    }))
    .concat(sit.filas.filter(function(a){ return a.stale; }));
  var vistos = {};
  pendientes = pendientes.filter(function(a){ if (vistos[a.id]) return false; vistos[a.id] = 1; return true; }).slice(0, 8);

  html += '<div class="tarjeta">' +
    '<h3>Lista de producción</h3>' +
    (pendientes.length
      ? '<div class="filas">' + pendientes.map(function(a){ return htmlFilaActivo(a, false); }).join('') + '</div>'
      : '<p class="tenue mini">Todos los activos están aprobados. Sólo queda montar y entregar.</p>') +
    '<button class="btn fantasma ancho pequeno" style="margin-top:12px" data-accion="ir" data-ruta="#/proyecto/' + esc(p.id) + '">Ver la sala de producción completa</button>' +
  '</div>';

  html += htmlListaProyectos(p.id);
  return html;
}

function htmlListaProyectos(excluir){
  var lista = (estado.resumenes || []).filter(function(r){ return r.id !== excluir; });
  if (!lista.length) return '';
  return '<div class="tarjeta"><h3>Otros proyectos</h3><div class="filas">' +
    lista.slice(0, 5).map(function(r){
      return '<button class="fila" data-accion="ir" data-ruta="#/proyecto/' + esc(r.id) + '">' +
        '<span class="nom">' + esc(r.title || 'Sin título') +
        '<small>' + esc(ETIQ_ETAPA[r.currentStage] || r.currentStage || '') + ' · ' +
          (r.approvedAssets || 0) + '/' + (r.totalAssets || 0) + ' aprobados</small></span>' +
        '<span class="etiq">' + esc(fmtTiempo(r.durationSec)) + '</span>' +
      '</button>';
    }).join('') + '</div></div>';
}

function prepararFormulario(){
  var c = estado.catalogo || {};
  var primera = function(lista, id){
    if (!Array.isArray(lista) || !lista.length) return '';
    var hallado = lista.find(function(x){ return x.id === id; });
    return (hallado || lista[0]).id;
  };
  estado.form = {
    busqueda: '',
    categoria: '',
    instrumentos: [],
    formacion: primera(c.formations, 'solo'),
    genero: primera(c.performerGenders, 'female'),
    tipo: '',
    escenario: primera(c.scenarios, 'forest'),
    escenarioTexto: '',
    estilo: primera(c.visualStyles, 'anime_cinematic'),
    estiloTexto: '',
    duracion: 120,
    direccion: ''
  };
  ajustarTipos();
}

/** Los tipos de intérprete dependen del género elegido: se recalculan siempre. */
function tiposDisponibles(){
  var c = estado.catalogo || {};
  var f = estado.form;
  return (c.performerTypes || []).filter(function(t){
    return !t.genderIds || t.genderIds.indexOf(f.genero) !== -1;
  });
}

function ajustarTipos(){
  var lista = tiposDisponibles();
  if (!lista.length) { estado.form.tipo = ''; return; }
  if (!lista.some(function(t){ return t.id === estado.form.tipo; })) estado.form.tipo = lista[0].id;
}

function instrumentosFiltrados(){
  var c = estado.catalogo || {};
  var f = estado.form;
  var lista = c.instruments || [];
  if (f.categoria) lista = lista.filter(function(i){ return i.categoryId === f.categoria; });
  var q = normalizar(f.busqueda);
  if (q) {
    lista = lista.filter(function(i){
      var campos = [i.name, i.id].concat(i.aliases || []).concat([i.origin || '']);
      return campos.some(function(v){ return normalizar(v).indexOf(q) !== -1; });
    });
  }
  return lista.slice(0, 40);
}

function htmlInstrumentos(){
  var c = estado.catalogo || {};
  var f = estado.form;
  var cats = {};
  (c.instrumentCategories || []).forEach(function(x){ cats[x.id] = x.label; });
  var lista = instrumentosFiltrados();
  if (!lista.length) {
    return '<p class="tenue mini" style="margin-top:12px">Ningún instrumento coincide con «' + esc(f.busqueda) + '».</p>';
  }
  return '<div class="opciones">' + lista.map(function(i){
    var puesto = f.instrumentos.indexOf(i.id) !== -1;
    return '<button class="opcion' + (puesto ? ' on' : '') + '" data-accion="instr" data-id="' + esc(i.id) + '">' +
      '<span><b>' + esc(i.name) + '</b><br><small>' + esc(cats[i.categoryId] || '') +
      (i.origin ? ' · ' + esc(i.origin) : '') + '</small></span>' +
      '<span class="etiq' + (puesto ? ' approved' : '') + '">' + (puesto ? 'elegido' : 'añadir') + '</span>' +
    '</button>';
  }).join('') + '</div>';
}

function htmlChipsElegidos(){
  var c = estado.catalogo || {};
  var f = estado.form;
  if (!f.instrumentos.length) {
    return '<p class="tenue mini" style="margin-top:10px">Elige al menos un instrumento.</p>';
  }
  var porId = {};
  (c.instruments || []).forEach(function(i){ porId[i.id] = i; });
  return '<div class="chips" style="margin-top:10px">' + f.instrumentos.map(function(id){
    return '<button class="chip on quitar" data-accion="instr" data-id="' + esc(id) + '">' +
      esc(porId[id] ? porId[id].name : id) + '</button>';
  }).join('') + '</div>';
}

function htmlTipos(){
  var lista = tiposDisponibles();
  if (!lista.length) return '<p class="tenue mini">No hay tipos para este intérprete.</p>';
  return '<div class="chips">' + lista.map(function(t){
    return '<button class="chip' + (estado.form.tipo === t.id ? ' on' : '') + '" data-accion="tipo" data-id="' + esc(t.id) + '">' +
      esc(t.label) + '</button>';
  }).join('') + '</div>';
}

function vistaCrear(){
  var cab = '<div class="cab"><div class="cab-tit"><h1>Nuevo corto</h1>' +
    '<p>La IA propone; tú apruebas cada pieza.</p></div></div>';

  if (!estado.catalogo) return cab + htmlCargando('Cargando los catálogos…');

  var c = estado.catalogo, f = estado.form;

    : [{ seconds:60, label:'1 min' }, { seconds:120, label:'2 min' }, { seconds:180, label:'3 min' }];

  var html = cab;

  html += '<div class="tarjeta">' +
    '<h3><span class="paso">1</span>Instrumentos</h3>' +

      '<button class="chip' + (f.categoria === '' ? ' on' : '') + '" data-accion="categoria" data-id="">Todas</button>' +
      (c.instrumentCategories || []).map(function(k){
        return '<button class="chip' + (f.categoria === k.id ? ' on' : '') + '" data-accion="categoria" data-id="' + esc(k.id) + '">' + esc(k.label) + '</button>';
      }).join('') +
    '</div>' +
    '<div id="chips-elegidos">' + htmlChipsElegidos() + '</div>' +
    '<div id="lista-instr">' + htmlInstrumentos() + '</div>' +
